            "dist/centralssh-${version}-fedora-aarch64.rpm"

  freebsd-amd64:
    runs-on: freebsd-15
    steps:
      - name: Install FreeBSD build dependencies
        shell: sh
        run: |
          set -eux
          PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${PATH:-}
          export PATH
          log_file="${RUNNER_TEMP:-/tmp}/freebsd-amd64-install-deps.log"
          : > "$log_file"
          exec >>"$log_file" 2>&1
          post_log() {
            context=$1
            payload_file=$(mktemp)
            host_and_path=${CI_LOG_ENDPOINT#http://}
            host_port=${host_and_path%%/*}
            request_path=/${host_and_path#*/}
            [ "$request_path" != "/$host_and_path" ] || request_path=/ingest
            host=${host_port%%:*}
            port=${host_port#*:}
            [ "$port" != "$host_port" ] || port=80
            {
              printf 'context=%s\n' "$context"
              printf 'status=error\n\n'
              tail -n 250 "$log_file"
            } > "$payload_file"
            if command -v curl >/dev/null 2>&1; then
              curl --fail --silent --show-error --header "Content-Type: text/plain; charset=utf-8" --data-binary @"$payload_file" "$CI_LOG_ENDPOINT" >/dev/null 2>&1 || true
            elif command -v nc >/dev/null 2>&1; then
              content_length=$(wc -c < "$payload_file" | tr -d ' ')
              {
                printf 'POST %s HTTP/1.1\r\n' "$request_path"
                printf 'Host: %s\r\n' "$host"
                printf 'Content-Type: text/plain; charset=utf-8\r\n'
                printf 'Content-Length: %s\r\n' "$content_length"
                printf 'Connection: close\r\n\r\n'
                cat "$payload_file"
              } | nc "$host" "$port" >/dev/null 2>&1 || true
            fi
            rm -f "$payload_file"
          }
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then post_log "freebsd-amd64/install-deps"; fi' EXIT
          echo "PATH=$PATH"
          uname -a || true
          for cmd in sh pkg curl fetch git gmake sudo nc; do
            if command -v "$cmd" >/dev/null 2>&1; then
              echo "$cmd=$(command -v "$cmd")"
            else
              echo "$cmd=missing"
            fi
          done
          sudo_cmd=
          if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            sudo_cmd="sudo -n"
          fi
          echo "uid=$(id -u)"
          echo "sudo_cmd=${sudo_cmd:-none}"
          if [ -n "$sudo_cmd" ] || [ "$(id -u)" -eq 0 ]; then
            echo "starting pkg update"
            $sudo_cmd pkg update -f
            echo "starting pkg install"
            $sudo_cmd pkg install -y aarch64-freebsd-sysroot ca_root_nss curl git || {
              echo "failed to install required FreeBSD build packages" >&2
              exit 1
            }
          fi
          command -v curl >/dev/null 2>&1
          command -v git >/dev/null 2>&1

      - name: Check out repository
        shell: sh
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: |
          set -eu
          PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${PATH:-}
          export PATH
          log_file="${RUNNER_TEMP:-/tmp}/freebsd-amd64-checkout.log"
          : > "$log_file"
          exec >>"$log_file" 2>&1
          post_log() {
            context=$1
            payload_file=$(mktemp)
            {
              printf 'context=%s\n' "$context"
              printf 'status=error\n\n'
              tail -n 250 "$log_file"
            } > "$payload_file"
            if command -v curl >/dev/null 2>&1; then
              curl --fail --silent --show-error --header "Content-Type: text/plain; charset=utf-8" --data-binary @"$payload_file" "$CI_LOG_ENDPOINT" >/dev/null 2>&1 || true
            fi
            rm -f "$payload_file"
          }
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then post_log "freebsd-amd64/checkout"; fi' EXIT

          server_url="${FORGEJO_SERVER_URL:-${GITHUB_SERVER_URL:?Missing server URL}}"
          repository="${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY:?Missing repository name}}"
          commit_sha="${FORGEJO_SHA:-${GITHUB_SHA:?Missing commit SHA}}"
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:?Missing Forgejo token}}"
          repo_dir="${RUNNER_TEMP:-/tmp}/centralssh"
          remote_url="${server_url%/}/${repository}.git"
          auth_header="$(printf 'x-access-token:%s' "$token" | base64 | tr -d '\n')"

          rm -rf "$repo_dir"
          git -c "http.extraHeader=AUTHORIZATION: basic ${auth_header}" \
            clone "$remote_url" "$repo_dir"
          git -C "$repo_dir" checkout --detach "$commit_sha"

          printf 'REPO_DIR=%s\n' "$repo_dir" >> "$GITHUB_ENV"

      - name: Build and validate FreeBSD amd64 artifacts
        shell: sh
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: |
          set -eu
          PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${PATH:-}
          export PATH
          log_file="${RUNNER_TEMP:-/tmp}/freebsd-amd64.log"
          : > "$log_file"
          exec >>"$log_file" 2>&1
          post_log() {
            context=$1
            payload_file=$(mktemp)
            host_and_path=${CI_LOG_ENDPOINT#http://}
