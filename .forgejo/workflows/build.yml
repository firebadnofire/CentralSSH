          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          chmod +x ./ci/build-freebsd-native.sh
          ./ci/build-freebsd-native.sh "$(sed -n 's/^version = \"\\(.*\\)\"/\\1/p' Cargo.toml | head -n1)" aarch64
