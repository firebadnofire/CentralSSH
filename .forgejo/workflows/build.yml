            g++ \
            libc6-dev-arm64-cross \
            git \
            make \
            netcat-openbsd \
            pkg-config \
            rpm \
            dpkg-dev \
            file \
            xz-utils \
            systemd

      - name: Check out repository
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP:-/tmp}/linux-packages-amd64-checkout.log"
          exec > >(tee -a "$log_file") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then { printf "context=%s\nstatus=error\n\n" "linux-packages-amd64/checkout"; grep -Ev "^(    Updating crates\\.io index| Downloading crates \\.\\.\\.|  Downloaded |   Compiling )" "$log_file" | tail -n 250; } | curl --fail --silent --show-error --header "Content-Type: text/plain; charset=utf-8" --data-binary @- "$CI_LOG_ENDPOINT" >/dev/null || true; fi' EXIT

          server_url="${FORGEJO_SERVER_URL:-${GITHUB_SERVER_URL:?Missing server URL}}"
          repository="${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY:?Missing repository name}}"
          commit_sha="${FORGEJO_SHA:-${GITHUB_SHA:?Missing commit SHA}}"
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:?Missing Forgejo token}}"
          repo_dir="${RUNNER_TEMP:-/tmp}/centralssh"
          remote_url="${server_url%/}/${repository}.git"
          auth_header="$(printf 'x-access-token:%s' "$token" | base64 | tr -d '\n')"

          rm -rf "$repo_dir"
          git -c "http.${server_url}/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            clone "$remote_url" "$repo_dir"
          git -C "$repo_dir" checkout --detach "$commit_sha"

          printf 'REPO_DIR=%s\n' "$repo_dir" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP:-/tmp}/linux-packages-amd64-rust-toolchain.log"
          exec > >(tee -a "$log_file") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then { printf "context=%s\nstatus=error\n\n" "linux-packages-amd64/install-rust"; grep -Ev "^(    Updating crates\\.io index| Downloading crates \\.\\.\\.|  Downloaded |   Compiling )" "$log_file" | tail -n 250; } | curl --fail --silent --show-error --header "Content-Type: text/plain; charset=utf-8" --data-binary @- "$CI_LOG_ENDPOINT" >/dev/null || true; fi' EXIT
          curl --fail --silent --show-error --location "$RUSTUP_INIT_URL" -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --default-toolchain "$RUST_TOOLCHAIN" --profile minimal
          printf '%s\n' "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" target add x86_64-unknown-linux-gnu

      - name: Build Linux amd64 packages
        shell: bash
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP:-/tmp}/linux-packages-amd64.log"
          exec > >(tee -a "$log_file") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then ./ci/post-ci-log.sh "linux-packages-amd64/build-and-validate" error "$log_file"; fi' EXIT
          cd "${REPO_DIR:?Missing checkout}"
          export PATH="$HOME/.cargo/bin:$PATH"
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          ./ci/package-linux.sh "$version" amd64
