  freebsd-amd64:
    runs-on: freebsd
    steps:
      - name: Install FreeBSD build dependencies
        shell: sh
        run: |
          set -eu
          log_file="${RUNNER_TEMP:-/tmp}/freebsd-amd64-install-deps.log"
          : > "$log_file"
          exec >>"$log_file" 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then { printf "context=%s\nstatus=error\n\n" "freebsd-amd64/install-deps"; grep -Ev "^(    Updating crates\\.io index| Downloading crates \\.\\.\\.|  Downloaded |   Compiling )" "$log_file" | tail -n 250; } | curl --fail --silent --show-error --header "Content-Type: text/plain; charset=utf-8" --data-binary @- "$CI_LOG_ENDPOINT" >/dev/null || true; fi' EXIT
          sudo_cmd=
          if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            sudo_cmd="sudo -n"
          fi
          if [ -n "$sudo_cmd" ] || [ "$(id -u)" -eq 0 ]; then
            $sudo_cmd pkg update -f
            $sudo_cmd pkg install -y ca_root_nss curl git gmake
          fi
          command -v curl >/dev/null 2>&1
          command -v git >/dev/null 2>&1
          command -v gmake >/dev/null 2>&1

      - name: Check out repository
        shell: sh
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: |
          set -eu
          log_file="${RUNNER_TEMP:-/tmp}/freebsd-amd64-checkout.log"
          : > "$log_file"
          exec >>"$log_file" 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then { printf "context=%s\nstatus=error\n\n" "freebsd-amd64/checkout"; grep -Ev "^(    Updating crates\\.io index| Downloading crates \\.\\.\\.|  Downloaded |   Compiling )" "$log_file" | tail -n 250; } | curl --fail --silent --show-error --header "Content-Type: text/plain; charset=utf-8" --data-binary @- "$CI_LOG_ENDPOINT" >/dev/null || true; fi' EXIT

