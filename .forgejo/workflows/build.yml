name: Package Releases

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-22.04
    container:
      image: rust:1.89-bookworm
      options: --network ci-network --user 0:0 -v /build-cache/cargo:/build-cache/cargo-home:z -v /build-cache/sccache:/build-cache/sccache:z -v /build-cache/target/centralssh/linux:/build-cache/target:z
    env:
      CI_PACKAGE_NAME: centralssh
      CI_PACKAGE_VERSION: 0.0.0
      CI_PACKAGE_COMMENT: Centralized SSH management
      CI_PACKAGE_ORIGIN: security/centralssh
      CI_PACKAGE_WWW: https://example.com
      CI_PACKAGE_MAINTAINER: root@localhost
      CI_PACKAGE_DESC: Centralized SSH management
      CI_RELEASE_TAG: ''
    steps:
      - name: Prepare checkout runtime
        shell: sh
        run: |
          set -eu
          {
            echo 'Acquire::http::Proxy "http://apt-cacher-ng:3142";'
            echo 'Acquire::https::Proxy "http://apt-cacher-ng:3142";'
          } > /etc/apt/apt.conf.d/01proxy
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git jq make dpkg-dev rpm xz-utils file pkg-config clang lld python3 python3-pip

      - &checkout_step
        name: Check out repository
        shell: sh
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN || secrets.GITHUB_TOKEN || '' }}
        run: |
          set -eu
          server_url="${FORGEJO_SERVER_URL:-${GITHUB_SERVER_URL:-}}"
          repository="${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY:-}}"
          ref="${FORGEJO_REF:-${GITHUB_REF:-}}"
          sha="${FORGEJO_SHA:-${GITHUB_SHA:-}}"
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:-}}"
          remote_url="${server_url%/}/${repository}.git"

          if [ -z "$server_url" ] || [ -z "$repository" ]; then
            echo "Missing server context for checkout." >&2
            exit 1
          fi

          git init .
          git remote remove origin 2>/dev/null || true
          git remote add origin "$remote_url"

          if [ -n "$token" ]; then
            auth_header="$(printf 'x-access-token:%s' "$token" | base64 | tr -d '\n')"
            git_fetch() {
              git -c "http.${remote_url}.extraheader=AUTHORIZATION: basic ${auth_header}" "$@"
            }
          else
            git_fetch() {
              git "$@"
            }
          fi

          if [ -n "$ref" ]; then
            git_fetch fetch --force --tags --prune --depth=1 origin "+${ref}:${ref}"
            git checkout --force --detach "$ref"
          elif [ -n "$sha" ]; then
            git_fetch fetch --force --tags --prune --depth=1 origin "$sha"
            git checkout --force --detach "$sha"
          else
            echo "Missing both ref and sha for checkout." >&2
            exit 1
          fi

          git submodule sync --recursive
          git submodule update --init --recursive --depth=1

      - name: Derive package metadata
        shell: sh
        run: |
          set -eu
          ./ci/package-env.sh env >> "$GITHUB_ENV"

      - name: Prepare Linux cache root
        shell: sh
        run: |
          set -eu
          install -d /build-cache /build-cache/cargo /build-cache/cargo-home /build-cache/sccache /build-cache/target /build-cache/target/centralssh /build-cache/target/centralssh/linux
          id
          ls -ld /build-cache /build-cache/*
          ls -Zd /build-cache /build-cache/* || true
          CACHE_ROOT="$(./ci/select-cache-root.sh /build-cache "$PWD/.ci-cache/linux")"
          if [ "$CACHE_ROOT" != "/build-cache" ]; then
            echo "Expected Linux cache root /build-cache but resolved ${CACHE_ROOT}" >&2
            exit 1
          fi

      - name: Install pinned sccache
        shell: sh
        run: |
          set -eu
          id
          ls -ld /build-cache /build-cache/*
          ls -Zd /build-cache /build-cache/* || true
          CACHE_ROOT="$(./ci/select-cache-root.sh /build-cache "$PWD/.ci-cache/linux")"
          if [ "$CACHE_ROOT" != "/build-cache" ]; then
            echo "Expected Linux cache root /build-cache but resolved ${CACHE_ROOT}" >&2
            exit 1
          fi
          export CI_CACHE_FALLBACK_ROOT="$PWD/.ci-cache/linux"
          eval "$(./ci/cache-env.sh linux-release release x86_64-unknown-linux-gnu "$CACHE_ROOT")"
          export PATH="$CARGO_HOME/bin:$PATH"
          ./ci/install-sccache.sh 0.10.0
          ./ci/log-rust-cache-stats.sh

      - name: Build Linux packages
        shell: sh
        run: |
          set -eu
          id
          ls -ld /build-cache /build-cache/*
          ls -Zd /build-cache /build-cache/* || true
          CACHE_ROOT="$(./ci/select-cache-root.sh /build-cache "$PWD/.ci-cache/linux")"
          if [ "$CACHE_ROOT" != "/build-cache" ]; then
            echo "Expected Linux cache root /build-cache but resolved ${CACHE_ROOT}" >&2
            exit 1
          fi
          export CI_CACHE_FALLBACK_ROOT="$PWD/.ci-cache/linux"
          eval "$(./ci/cache-env.sh linux-release release x86_64-unknown-linux-gnu "$CACHE_ROOT")"
          export PATH="$CARGO_HOME/bin:$PATH"
          if command -v sccache >/dev/null 2>&1; then
            export RUSTC_WRAPPER=sccache
          fi
          ./ci/package-linux.sh

      - name: Log Linux cache stats
        if: always()
        shell: sh
        run: |
          set -eu
          id
          ls -ld /build-cache /build-cache/* 2>/dev/null || true
          ls -Zd /build-cache /build-cache/* 2>/dev/null || true
          CACHE_ROOT="$(./ci/select-cache-root.sh /build-cache "$PWD/.ci-cache/linux")"
          if [ "$CACHE_ROOT" != "/build-cache" ]; then
            echo "Expected Linux cache root /build-cache but resolved ${CACHE_ROOT}" >&2
            exit 1
          fi
          export CI_CACHE_FALLBACK_ROOT="$PWD/.ci-cache/linux"
          eval "$(./ci/cache-env.sh linux-release release x86_64-unknown-linux-gnu "$CACHE_ROOT")"
          export PATH="$CARGO_HOME/bin:$PATH"
          ./ci/log-rust-cache-stats.sh

      - name: Validate Linux packages
        shell: sh
        run: |
          set -eu
          ./ci/validate-linux-packages.sh

      - name: Publish Linux packages
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: sh
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN || secrets.GITHUB_TOKEN || '' }}
          CI_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          ./ci/upload-release-assets.sh dist

  freebsd:
    runs-on: ubuntu-22.04
    steps:
      - name: Prepare QEMU host runtime
        shell: sh
        run: |
          set -eu
          if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          else
            SUDO=""
          fi

          {
            echo 'Acquire::http::Proxy "http://apt-cacher-ng:3142";'
            echo 'Acquire::https::Proxy "http://apt-cacher-ng:3142";'
          } > /etc/apt/apt.conf.d/01proxy
          ${SUDO} apt-get update
          ${SUDO} apt-get install -y --no-install-recommends \
            ca-certificates \
            cloud-image-utils \
            curl \
            genisoimage \
            git \
            jq \
            openssh-client \
            qemu-system-x86 \
            qemu-utils \
            xorriso \
            xz-utils \
            zstd
          if [ -e /dev/kvm ]; then
            echo "/dev/kvm is available"
          else
            echo "/dev/kvm is not available; FreeBSD VM will use software emulation"
          fi

      - *checkout_step

      - name: Prepare FreeBSD QEMU image
        shell: sh
        run: |
          set -eu
          ./ci/freebsd-qemu-build.sh prepare-image

      - name: Boot FreeBSD VM and build package
        shell: sh
        run: |
          set -eu
          ./ci/freebsd-qemu-build.sh build

      - name: Validate FreeBSD artifact
        shell: sh
        run: |
          set -eu
          test -n "$(find dist -maxdepth 1 -type f -name '*-freebsd-amd64.pkg' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name '*-freebsd-amd64.tar.gz' -print -quit)"
          test -f dist/SHA256SUMS-freebsd.txt

      - name: Publish FreeBSD package on tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: sh
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN || secrets.GITHUB_TOKEN || '' }}
          CI_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          ./ci/upload-release-assets.sh dist

  merge:
    runs-on: ubuntu-22.04
    needs: [linux, freebsd]
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.linux.result }}" = "success" ] && [ "${{ needs.freebsd.result }}" = "success" ]; then
            echo "::notice::All builds succeeded"
          else
            echo "::error::Build failed: linux=${{ needs.linux.result }}, freebsd=${{ needs.freebsd.result }}"
            exit 1
          fi
