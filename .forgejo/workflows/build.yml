name: Release

on:
  push:
    tags:
      - "v*"
      - "V*"

jobs:
  release:
    runs-on: ubuntu-22.04
    container:
      image: docker.io/library/ubuntu:22.04
      options: --network ci-network

    steps:
      - name: Install release dependencies
        shell: bash
        run: |
          set -euo pipefail

          apt_get="apt-get"
          tee_cmd="tee"
          if command -v sudo >/dev/null 2>&1; then
            apt_get="sudo apt-get"
            tee_cmd="sudo tee"
          fi

          {
            echo 'Acquire::http::Proxy "http://apt-cacher-ng:3142";'
            echo 'Acquire::https::Proxy "http://apt-cacher-ng:3142";'
          } | $tee_cmd /etc/apt/apt.conf.d/01proxy >/dev/null

          $apt_get update
          $apt_get install -y --no-install-recommends \
            ca-certificates \
            coreutils \
            curl \
            file \
            gcc \
            gcc-aarch64-linux-gnu \
            genisoimage \
            git \
            jq \
            libc6-dev-arm64-cross \
            make \
            openssh-client \
            qemu-efi-aarch64 \
            qemu-system-arm \
            qemu-system-x86 \
            qemu-utils \
            xz-utils

      - name: Check out repository
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: |
          set -euo pipefail

          server_url="${FORGEJO_SERVER_URL:-${GITHUB_SERVER_URL:?Missing Forgejo server URL}}"
          repository="${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY:?Missing repository name}}"
          tag="${FORGEJO_REF_NAME:-${GITHUB_REF_NAME:?Missing tag ref name}}"
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:?Missing Forgejo token}}"
          repo_dir="${RUNNER_TEMP:-/tmp}/centralssh"
          remote_url="${server_url}/${repository}.git"
          auth_header="$(printf 'x-access-token:%s' "$token" | base64 | tr -d '\n')"

          rm -rf "$repo_dir"
          git -c "http.${server_url}/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            clone "$remote_url" "$repo_dir"
          git -C "$repo_dir" -c "http.${server_url}/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            fetch --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'
          git -C "$repo_dir" checkout --detach "refs/tags/${tag}"

          printf 'REPO_DIR=%s\n' "$repo_dir" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail

          tool_dir="${RUNNER_TEMP:-/tmp}/rustup"
          export CARGO_HOME="${tool_dir}/cargo"
          export RUSTUP_HOME="${tool_dir}/rustup"
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"

          curl --fail --silent --show-error --location https://sh.rustup.rs --output "${tool_dir}/rustup-init.sh"
          sh "${tool_dir}/rustup-init.sh" -y --no-modify-path --default-toolchain stable
          . "${CARGO_HOME}/env"
          rustup target add aarch64-unknown-linux-gnu

          printf '%s\n' "${CARGO_HOME}/bin" >> "$GITHUB_PATH"
          cargo --version
          rustc --version

      - name: Validate release inputs
        shell: bash
        env:
          GH_KEY: ${{ secrets.GH_KEY }}
        run: |
          set -euo pipefail

          for name in GH_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret: ${name}" >&2
              exit 1
            fi
          done

          for tool in \
            base64 \
            cargo \
            curl \
            file \
            git \
            jq \
            qemu-img \
            qemu-system-aarch64 \
            qemu-system-x86_64 \
            rustc \
            sha256sum \
            sha512sum \
            ssh \
            ssh-keygen \
            tar \
            xz
          do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "Missing required tool: ${tool}" >&2
              exit 1
            fi
          done

      - name: Build Linux release assets
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          set -euo pipefail

          . "${RUNNER_TEMP:-/tmp}/rustup/cargo/env"
          cd "${REPO_DIR:?Missing repository checkout directory}"
          tag="${FORGEJO_REF_NAME:-${GITHUB_REF_NAME:?Missing tag ref name}}"

          cargo fetch --locked
          mkdir -p dist

          for arch in amd64 arm64; do
            case "$arch" in
              amd64)
                rust_target="x86_64-unknown-linux-gnu"
                ;;
              arm64)
                rust_target="aarch64-unknown-linux-gnu"
                ;;
              *)
                echo "Unsupported Linux release architecture: ${arch}" >&2
                exit 1
                ;;
            esac

            cargo build --locked --release --target "$rust_target"

            package_root="${RUNNER_TEMP:-/tmp}/release-linux-${arch}"
            bundle_dir="${package_root}/centralssh"
            rm -rf "$package_root"
            mkdir -p \
              "${bundle_dir}/bin" \
              "${bundle_dir}/etc/centralssh" \
              "${bundle_dir}/packaging/freebsd" \
              "${bundle_dir}/packaging/systemd"

            install -m 0755 "target/${rust_target}/release/centralssh" "${bundle_dir}/bin/centralssh"
            install -m 0755 tools/cssh-keyscan "${bundle_dir}/bin/cssh-keyscan"
            install -m 0600 examples/config.toml "${bundle_dir}/etc/centralssh/config.toml"
            install -m 0600 examples/servers.toml "${bundle_dir}/etc/centralssh/servers.toml"
            : > "${bundle_dir}/etc/centralssh/known_hosts"
            chmod 0600 "${bundle_dir}/etc/centralssh/known_hosts"
            install -m 0555 packaging/freebsd/centralssh "${bundle_dir}/packaging/freebsd/centralssh"
            install -m 0644 packaging/systemd/centralssh.service "${bundle_dir}/packaging/systemd/centralssh.service"
            install -m 0644 LICENSE "${bundle_dir}/LICENSE"
            install -m 0644 README.md "${bundle_dir}/README.md"
            install -m 0644 op-guide.md "${bundle_dir}/op-guide.md"

            tar -C "$package_root" -czf "dist/centralssh-${tag}-linux-${arch}.tar.gz" centralssh
          done

      - name: Build FreeBSD release assets
        shell: bash
        env:
          FREEBSD_QEMU_MEM: "3072"
          FREEBSD_QEMU_CPUS: "2"
        run: |
          set -euo pipefail

          . "${RUNNER_TEMP:-/tmp}/rustup/cargo/env"
          cd "${REPO_DIR:?Missing repository checkout directory}"
          tag="${FORGEJO_REF_NAME:-${GITHUB_REF_NAME:?Missing tag ref name}}"

          mkdir -p dist

          for arch in amd64 aarch64; do
            ./ci/freebsd-qemu-build.sh build "$arch"
            built_asset="$(find dist -maxdepth 1 -type f -name "*-freebsd-${arch}.pkg" | sort | tail -n 1)"
            if [ -z "$built_asset" ]; then
              echo "Expected FreeBSD package for ${arch} was not produced." >&2
              exit 1
            fi
            final_asset="dist/centralssh-${tag}-freebsd-${arch}.pkg"
            mv "$built_asset" "$final_asset"
            file "$final_asset" >/dev/null
          done

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          cd "${REPO_DIR:?Missing repository checkout directory}"
          tag="${FORGEJO_REF_NAME:-${GITHUB_REF_NAME:?Missing tag ref name}}"
          assets_file="${RUNNER_TEMP:-/tmp}/centralssh-release-assets.txt"

          asset_paths=(
            "dist/centralssh-${tag}-linux-amd64.tar.gz"
            "dist/centralssh-${tag}-linux-arm64.tar.gz"
            "dist/centralssh-${tag}-freebsd-amd64.pkg"
            "dist/centralssh-${tag}-freebsd-aarch64.pkg"
          )

          : > "$assets_file"
          for asset_path in "${asset_paths[@]}"; do
            if [ ! -f "$asset_path" ]; then
              echo "Expected release asset at ${asset_path}." >&2
              exit 1
            fi
            printf '%s\n' "${REPO_DIR}/${asset_path}" >> "$assets_file"
          done

          sha256sum "${asset_paths[@]}" > dist/sha256sums.txt
          printf '%s\n' "${REPO_DIR}/dist/sha256sums.txt" >> "$assets_file"
          printf 'ASSETS_FILE=%s\n' "$assets_file" >> "$GITHUB_ENV"

      - name: Publish Forgejo release
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: |
          set -euo pipefail

          api_url="${FORGEJO_API_URL:-${GITHUB_API_URL:?Missing Forgejo API URL}}"
          repository="${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY:?Missing repository name}}"
          tag="${FORGEJO_REF_NAME:-${GITHUB_REF_NAME:?Missing tag ref name}}"
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:?Missing Forgejo token}}"
          owner="${repository%%/*}"
          repo="${repository#*/}"
          assets_file="${ASSETS_FILE:?Missing release asset list file}"
          release_name="CentralSSH ${tag}"
          release_body="Automated CentralSSH release for ${tag}. See sha256sums.txt for checksums."

          api_request() {
            local method="$1"
            local url="$2"
            shift 2
            curl --fail-with-body --silent --show-error \
              --request "$method" \
              --header "Authorization: token ${token}" \
              "$@" \
              "$url"
          }

          upload_asset() {
            local release_id="$1"
            local asset_path="$2"
            local asset_name
            local asset_name_encoded
            local existing_asset_id

            if [ ! -f "$asset_path" ]; then
              echo "Expected release asset at ${asset_path}." >&2
              exit 1
            fi

            asset_name="$(basename "$asset_path")"
            asset_name_encoded="$(jq -nr --arg value "$asset_name" '$value|@uri')"
            existing_asset_id="$(api_request GET "${api_url}/repos/${owner}/${repo}/releases/${release_id}/assets" \
              | jq -r --arg name "$asset_name" '.[] | select(.name == $name) | .id' \
              | head -n 1)"

            if [ -n "$existing_asset_id" ]; then
              api_request DELETE "${api_url}/repos/${owner}/${repo}/releases/${release_id}/assets/${existing_asset_id}" >/dev/null
            fi

            api_request POST "${api_url}/repos/${owner}/${repo}/releases/${release_id}/assets?name=${asset_name_encoded}" \
              --form "attachment=@${asset_path}" >/dev/null
          }

          release_response="$(mktemp)"
          release_status="$(curl --silent --show-error \
            --output "$release_response" \
            --write-out "%{http_code}" \
            --header "Authorization: token ${token}" \
            "${api_url}/repos/${owner}/${repo}/releases/tags/${tag}")"

          if [ "$release_status" = "404" ]; then
            release_payload="$(jq -n \
              --arg tag "$tag" \
              --arg name "$release_name" \
              --arg body "$release_body" \
              '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false, hide_archive_links: false}')"
            release_json="$(api_request POST "${api_url}/repos/${owner}/${repo}/releases" \
              --header "Content-Type: application/json" \
              --data "$release_payload")"
          elif [ "$release_status" = "200" ]; then
            release_json="$(cat "$release_response")"
            release_id="$(printf '%s' "$release_json" | jq -r '.id')"
            release_payload="$(jq -n \
              --arg tag "$tag" \
              --arg name "$release_name" \
              --arg body "$release_body" \
              '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false, hide_archive_links: false}')"
            release_json="$(api_request PATCH "${api_url}/repos/${owner}/${repo}/releases/${release_id}" \
              --header "Content-Type: application/json" \
              --data "$release_payload")"
          else
            cat "$release_response" >&2
            echo "Failed to look up release for ${tag}: HTTP ${release_status}" >&2
            exit 1
          fi

          release_id="$(printf '%s' "$release_json" | jq -r '.id')"
          if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
            echo "Release response did not include an id." >&2
            exit 1
          fi

          if [ ! -f "$assets_file" ]; then
            echo "Expected release asset list at ${assets_file}." >&2
            exit 1
          fi

          while IFS= read -r asset_path; do
            if [ -z "$asset_path" ]; then
              continue
            fi
            upload_asset "$release_id" "$asset_path"
          done < "$assets_file"

      - name: Sync repository to GitHub
        shell: bash
        env:
          GH_KEY: ${{ secrets.GH_KEY }}
        run: |
          set -euo pipefail

          cd "${REPO_DIR:?Missing repository checkout directory}"
          api_url="https://api.github.com"
          owner="firebadnofire"
          repo="centralssh"
          token="${GH_KEY:?Missing GitHub token}"

          github_api_request() {
            local method="$1"
            local url="$2"
            local response_file
            local status
            shift 2
            response_file="$(mktemp)"
            status="$(curl --silent --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --request "$method" \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${token}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$@" \
              "$url")"
            if [ "$status" -lt 200 ] || [ "$status" -gt 299 ]; then
              cat "$response_file" >&2
              echo "GitHub API request failed: ${method} ${url} returned HTTP ${status}" >&2
              exit 1
            fi
            cat "$response_file"
          }

          github_repo_status() {
            local response_file
            response_file="$(mktemp)"
            curl --silent --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${token}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${api_url}/repos/${owner}/${repo}"
          }

          github_git_push() {
            local remote_url="https://github.com/${owner}/${repo}.git"
            local auth_header
            auth_header="$(printf 'x-access-token:%s' "$token" | base64 | tr -d '\n')"
            git -c "http.${remote_url}.extraheader=AUTHORIZATION: basic ${auth_header}" \
              push "$remote_url" "$@"
          }

          github_migrate() {
            local repo_status
            local owner_json
            local owner_type
            local authenticated_login
            local create_payload
            local branch_refspecs=()
            local ref_name
            local short_name

            repo_status="$(github_repo_status)"
            if [ "$repo_status" = "404" ]; then
              owner_json="$(github_api_request GET "${api_url}/users/${owner}")"
              owner_type="$(printf '%s' "$owner_json" | jq -r '.type')"
              create_payload="$(jq -n \
                --arg name "$repo" \
                --arg description "CentralSSH mirror" \
                '{name: $name, description: $description, private: false, auto_init: false}')"

              if [ "$owner_type" = "Organization" ]; then
                github_api_request POST "${api_url}/orgs/${owner}/repos" \
                  --header "Content-Type: application/json" \
                  --data "$create_payload" >/dev/null
              elif [ "$owner_type" = "User" ]; then
                authenticated_login="$(github_api_request GET "${api_url}/user" | jq -r '.login')"
                if [ "$authenticated_login" != "$owner" ]; then
                  echo "Cannot create ${owner}/${repo}: GH_KEY authenticates as ${authenticated_login}, not ${owner}." >&2
                  exit 1
                fi
                github_api_request POST "${api_url}/user/repos" \
                  --header "Content-Type: application/json" \
                  --data "$create_payload" >/dev/null
              else
                echo "Unsupported GitHub owner type for ${owner}: ${owner_type}" >&2
                exit 1
              fi
            elif [ "$repo_status" != "200" ]; then
              echo "Failed to check GitHub repository ${owner}/${repo}: HTTP ${repo_status}" >&2
              exit 1
            fi

            while read -r ref_name short_name; do
              short_name="${short_name#origin/}"
              if [ "$short_name" = "HEAD" ]; then
                continue
              fi
              branch_refspecs+=("${ref_name}:refs/heads/${short_name}")
            done < <(git for-each-ref --format='%(refname) %(refname:short)' refs/remotes/origin)

            if [ "${#branch_refspecs[@]}" -gt 0 ]; then
              github_git_push "${branch_refspecs[@]}"
            else
              echo "No remote branches were found to sync." >&2
              exit 1
            fi

            github_git_push "refs/tags/*:refs/tags/*"
          }

          github_migrate

      - name: Publish GitHub release
        shell: bash
        env:
          GH_KEY: ${{ secrets.GH_KEY }}
        run: |
          set -euo pipefail

          api_url="https://api.github.com"
          upload_url="https://uploads.github.com"
          owner="firebadnofire"
          repo="centralssh"
          tag="${FORGEJO_REF_NAME:-${GITHUB_REF_NAME:?Missing tag ref name}}"
          token="${GH_KEY:?Missing GitHub token}"
          assets_file="${ASSETS_FILE:?Missing release asset list file}"
          release_name="CentralSSH ${tag}"
          release_body="Automated CentralSSH release for ${tag}. See sha256sums.txt for checksums."

          github_request() {
            local method="$1"
            local url="$2"
            local response_file
            local status
            shift 2
            response_file="$(mktemp)"
            status="$(curl --silent --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --request "$method" \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${token}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$@" \
              "$url")"
            if [ "$status" -lt 200 ] || [ "$status" -gt 299 ]; then
              cat "$response_file" >&2
              echo "GitHub API request failed: ${method} ${url} returned HTTP ${status}" >&2
              exit 1
            fi
            cat "$response_file"
          }

          upload_asset() {
            local release_id="$1"
            local asset_path="$2"
            local asset_name
            local asset_name_encoded
            local existing_asset_id

            if [ ! -f "$asset_path" ]; then
              echo "Expected release asset at ${asset_path}." >&2
              exit 1
            fi

            asset_name="$(basename "$asset_path")"
            asset_name_encoded="$(jq -nr --arg value "$asset_name" '$value|@uri')"
            existing_asset_id="$(github_request GET "${api_url}/repos/${owner}/${repo}/releases/${release_id}/assets" \
              | jq -r --arg name "$asset_name" '.[] | select(.name == $name) | .id' \
              | head -n 1)"

            if [ -n "$existing_asset_id" ]; then
              github_request DELETE "${api_url}/repos/${owner}/${repo}/releases/assets/${existing_asset_id}" >/dev/null
            fi

            github_request POST "${upload_url}/repos/${owner}/${repo}/releases/${release_id}/assets?name=${asset_name_encoded}" \
              --header "Content-Type: application/octet-stream" \
              --data-binary "@${asset_path}" >/dev/null
          }

          release_response="$(mktemp)"
          release_status="$(curl --silent --show-error \
            --output "$release_response" \
            --write-out "%{http_code}" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${token}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${api_url}/repos/${owner}/${repo}/releases/tags/${tag}")"

          if [ "$release_status" = "404" ]; then
            release_payload="$(jq -n \
              --arg tag "$tag" \
              --arg name "$release_name" \
              --arg body "$release_body" \
              '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false, make_latest: "true"}')"
            release_json="$(github_request POST "${api_url}/repos/${owner}/${repo}/releases" \
              --header "Content-Type: application/json" \
              --data "$release_payload")"
          elif [ "$release_status" = "200" ]; then
            release_json="$(cat "$release_response")"
            release_id="$(printf '%s' "$release_json" | jq -r '.id')"
            release_payload="$(jq -n \
              --arg tag "$tag" \
              --arg name "$release_name" \
              --arg body "$release_body" \
              '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false, make_latest: "true"}')"
            release_json="$(github_request PATCH "${api_url}/repos/${owner}/${repo}/releases/${release_id}" \
              --header "Content-Type: application/json" \
              --data "$release_payload")"
          else
            cat "$release_response" >&2
            echo "Failed to look up GitHub release for ${tag}: HTTP ${release_status}" >&2
            exit 1
          fi

          release_id="$(printf '%s' "$release_json" | jq -r '.id')"
          if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
            echo "GitHub release response did not include an id." >&2
            exit 1
          fi

          if [ ! -f "$assets_file" ]; then
            echo "Expected release asset list at ${assets_file}." >&2
            exit 1
          fi

          while IFS= read -r asset_path; do
            if [ -z "$asset_path" ]; then
              continue
            fi
            upload_asset "$release_id" "$asset_path"
          done < "$assets_file"
