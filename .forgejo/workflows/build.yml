  release-publish:
    runs-on: ubuntu-22.04
    needs:
      - linux-packages-amd64
      - linux-packages-arm64
      - freebsd-amd64
      - freebsd-aarch64
    steps:
      - name: Install release dependencies
        shell: bash
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP:-/tmp}/release-publish-install-deps.log"
          exec > >(tee -a "$log_file") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then { printf "context=%s\nstatus=error\n\n" "release-publish/install-deps"; grep -Ev "^(    Updating crates\\.io index| Downloading crates \\.\\.\\.|  Downloaded |   Compiling )" "$log_file" | tail -n 250; } | curl --fail --silent --show-error --header "Content-Type: text/plain; charset=utf-8" --data-binary @- "$CI_LOG_ENDPOINT" >/dev/null || true; fi' EXIT
          apt_get="apt-get"
          if command -v sudo >/dev/null 2>&1; then
            apt_get="sudo apt-get"
          fi
          $apt_get update
          $apt_get install -y --no-install-recommends ca-certificates curl git jq

      - name: Check out repository
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP:-/tmp}/release-publish-checkout.log"
          exec > >(tee -a "$log_file") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then { printf "context=%s\nstatus=error\n\n" "release-publish/checkout"; grep -Ev "^(    Updating crates\\.io index| Downloading crates \\.\\.\\.|  Downloaded |   Compiling )" "$log_file" | tail -n 250; } | curl --fail --silent --show-error --header "Content-Type: text/plain; charset=utf-8" --data-binary @- "$CI_LOG_ENDPOINT" >/dev/null || true; fi' EXIT

          server_url="${FORGEJO_SERVER_URL:-${GITHUB_SERVER_URL:?Missing server URL}}"
          repository="${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY:?Missing repository name}}"
          commit_sha="${FORGEJO_SHA:-${GITHUB_SHA:?Missing commit SHA}}"
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:?Missing Forgejo token}}"
          repo_dir="${RUNNER_TEMP:-/tmp}/centralssh-release"
          remote_url="${server_url%/}/${repository}.git"
          auth_header="$(printf 'x-access-token:%s' "$token" | base64 | tr -d '\n')"

          rm -rf "$repo_dir"
          git -c "http.extraHeader=AUTHORIZATION: basic ${auth_header}" \
            clone "$remote_url" "$repo_dir"
          git -C "$repo_dir" checkout --detach "$commit_sha"

          printf 'REPO_DIR=%s\n' "$repo_dir" >> "$GITHUB_ENV"

      - name: Publish Forgejo release
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: |
          set -euo pipefail
          last_command=
          log_file="${RUNNER_TEMP:-/tmp}/release-publish-forgejo.log"
          exec > >(tee -a "$log_file") 2>&1
          trap 'last_command=$BASH_COMMAND' DEBUG
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then FAILED_COMMAND="$last_command" ./ci/post-ci-log.sh "release-publish/forgejo-release" error "$log_file"; fi' EXIT
          cd "${REPO_DIR:?Missing checkout}"
          ./ci/publish-release.sh

      - name: Sync repository to GitHub
        shell: bash
        env:
          GH_KEY: ${{ secrets.GH_KEY }}
        run: |
          set -euo pipefail
          last_command=
          log_file="${RUNNER_TEMP:-/tmp}/release-publish-github-sync.log"
          exec > >(tee -a "$log_file") 2>&1
          trap 'last_command=$BASH_COMMAND' DEBUG
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then FAILED_COMMAND="$last_command" ./ci/post-ci-log.sh "release-publish/github-sync" error "$log_file"; fi' EXIT
          cd "${REPO_DIR:?Missing checkout}"
          ./ci/sync-github-mirror.sh

      - name: Publish GitHub release
        shell: bash
        env:
          GH_KEY: ${{ secrets.GH_KEY }}
        run: |
          set -euo pipefail
          last_command=
          log_file="${RUNNER_TEMP:-/tmp}/release-publish-github.log"
          exec > >(tee -a "$log_file") 2>&1
          trap 'last_command=$BASH_COMMAND' DEBUG
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then FAILED_COMMAND="$last_command" ./ci/post-ci-log.sh "release-publish/github-release" error "$log_file"; fi' EXIT
          cd "${REPO_DIR:?Missing checkout}"
          ./ci/publish-github-release.sh
