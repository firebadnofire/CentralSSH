name: Package Releases

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: ubuntu-22.04
    container:
      image: rust:1.89-bookworm
      options: --network ci-network

    steps:
      - name: Prepare checkout runtime
        shell: sh
        run: |
          set -eu
          {
            echo 'Acquire::http::Proxy "http://apt-cacher-ng:3142";'
            echo 'Acquire::https::Proxy "http://apt-cacher-ng:3142";'
          } > /etc/apt/apt.conf.d/01proxy
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git jq make dpkg-dev rpm xz-utils file pkg-config clang lld

      - name: Check out repository
        shell: sh
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: |
          set -eu
          server_url="${FORGEJO_SERVER_URL:-${GITHUB_SERVER_URL:-}}"
          repository="${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY:-}}"
          ref="${FORGEJO_REF:-${GITHUB_REF:-}}"
          sha="${FORGEJO_SHA:-${GITHUB_SHA:-}}"
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:-}}"
          remote_url="${server_url%/}/${repository}.git"

          if [ -z "$server_url" ] || [ -z "$repository" ]; then
            echo "Missing Forgejo repository context for checkout." >&2
            exit 1
          fi

          git init .
          git remote add origin "$remote_url"

          if [ -n "$token" ]; then
            auth_header="$(printf 'x-access-token:%s' "$token" | base64 | tr -d '\n')"
            git_fetch() {
              git -c "http.${remote_url}.extraheader=AUTHORIZATION: basic ${auth_header}" "$@"
            }
          else
            git_fetch() {
              git "$@"
            }
          fi

          if [ -n "$ref" ]; then
            git_fetch fetch --force --tags --prune --depth=1 origin "+${ref}:${ref}"
            git checkout --force --detach "$ref"
          elif [ -n "$sha" ]; then
            git_fetch fetch --force --tags --prune --depth=1 origin "$sha"
            git checkout --force --detach "$sha"
          else
            echo "Missing both ref and sha for checkout." >&2
            exit 1
          fi

          git submodule sync --recursive
          git submodule update --init --recursive --depth=1

      - name: Derive package metadata
        shell: sh
        run: |
          set -eu
          package_name="$(sed -n 's/^name = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          package_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          package_comment="$(sed -n 's/^description = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          repo_path="${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY:-}}"
          server_url="${FORGEJO_SERVER_URL:-${GITHUB_SERVER_URL:-}}"
          repo_url="${server_url%/}/${repo_path}"
          tag_name="${FORGEJO_REF_NAME:-${GITHUB_REF_NAME:-}}"

          {
            echo "CI_PACKAGE_NAME=${package_name}"
            echo "CI_PACKAGE_VERSION=${package_version}"
            echo "CI_PACKAGE_COMMENT=${package_comment}"
            echo "CI_PACKAGE_ORIGIN=security/${package_name}"
            echo "CI_PACKAGE_WWW=${repo_url}"
            echo "CI_PACKAGE_MAINTAINER=root@localhost"
            echo "CI_PACKAGE_DESC=${package_comment}"
            echo "CI_RELEASE_TAG=${tag_name}"
          } >> "$GITHUB_ENV"

      - name: Build binaries and packages
        shell: sh
        env:
          CI_PACKAGE_NAME: ${{ env.CI_PACKAGE_NAME }}
          CI_PACKAGE_VERSION: ${{ env.CI_PACKAGE_VERSION }}
          CI_PACKAGE_COMMENT: ${{ env.CI_PACKAGE_COMMENT }}
          CI_PACKAGE_ORIGIN: ${{ env.CI_PACKAGE_ORIGIN }}
          CI_PACKAGE_WWW: ${{ env.CI_PACKAGE_WWW }}
          CI_PACKAGE_MAINTAINER: ${{ env.CI_PACKAGE_MAINTAINER }}
          CI_PACKAGE_DESC: ${{ env.CI_PACKAGE_DESC }}
        run: |
          set -eu

          mkdir -p dist
          mkdir -p stage/linux stage/freebsd stage/meta stage/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}

          cargo build --release
          make install DESTDIR="$PWD/stage/linux" PREFIX=/usr

          mkdir -p stage/linux/DEBIAN
          cat > stage/linux/DEBIAN/control <<EOF
          Package: ${CI_PACKAGE_NAME}
          Version: ${CI_PACKAGE_VERSION}
          Section: admin
          Priority: optional
          Architecture: amd64
          Maintainer: ${CI_PACKAGE_MAINTAINER}
          Description: ${CI_PACKAGE_DESC}
          EOF
          dpkg-deb --build stage/linux "dist/${CI_PACKAGE_NAME}_${CI_PACKAGE_VERSION}_amd64.deb"

          tar -C stage/linux -czf "stage/rpmbuild/SOURCES/${CI_PACKAGE_NAME}-${CI_PACKAGE_VERSION}-linux-root.tar.gz" .
          cat > "stage/rpmbuild/SPECS/${CI_PACKAGE_NAME}.spec" <<EOF
          Name: ${CI_PACKAGE_NAME}
          Version: ${CI_PACKAGE_VERSION}
          Release: 1%{?dist}
          Summary: ${CI_PACKAGE_COMMENT}
          License: GPL-3.0-only
          URL: ${CI_PACKAGE_WWW}
          BuildArch: x86_64
          Source0: ${CI_PACKAGE_NAME}-${CI_PACKAGE_VERSION}-linux-root.tar.gz

          %description
          ${CI_PACKAGE_DESC}

          %prep

          %build

          %install
          mkdir -p %{buildroot}
          tar -C %{buildroot} -xzf %{SOURCE0}

          %files
          /usr/sbin/${CI_PACKAGE_NAME}
          /usr/bin/cssh-keyscan
          /etc/systemd/system/${CI_PACKAGE_NAME}.service
          %dir /etc/centralssh
          %dir /etc/centralssh/users
          /etc/centralssh/config.toml
          /etc/centralssh/servers.toml
          /etc/centralssh/known_hosts
          %dir /var/log/centralssh
          /var/log/centralssh/audit.jsonl
          EOF
          rpmbuild --define "_topdir $PWD/stage/rpmbuild" -bb "stage/rpmbuild/SPECS/${CI_PACKAGE_NAME}.spec"
          cp "stage/rpmbuild/RPMS/x86_64/${CI_PACKAGE_NAME}-${CI_PACKAGE_VERSION}-1.x86_64.rpm" "dist/${CI_PACKAGE_NAME}-${CI_PACKAGE_VERSION}-1.x86_64.rpm"

          rustup target add x86_64-unknown-freebsd
          cargo build --release --target x86_64-unknown-freebsd

          install -d "stage/freebsd/usr/local/sbin"
          install -d "stage/freebsd/usr/local/bin"
          install -d "stage/freebsd/usr/local/etc/rc.d"
          install -d -m 0700 "stage/freebsd/etc/centralssh/users"
          install -d -m 0700 "stage/freebsd/var/log/centralssh"
          install -m 0755 "target/x86_64-unknown-freebsd/release/${CI_PACKAGE_NAME}" "stage/freebsd/usr/local/sbin/${CI_PACKAGE_NAME}"
          install -m 0755 "tools/cssh-keyscan" "stage/freebsd/usr/local/bin/cssh-keyscan"
          install -m 0555 "packaging/freebsd/centralssh" "stage/freebsd/usr/local/etc/rc.d/${CI_PACKAGE_NAME}"
          install -m 0600 "examples/config.toml" "stage/freebsd/etc/centralssh/config.toml"
          install -m 0600 "examples/servers.toml" "stage/freebsd/etc/centralssh/servers.toml"
          install -m 0600 /dev/null "stage/freebsd/etc/centralssh/known_hosts"
          install -m 0600 /dev/null "stage/freebsd/var/log/centralssh/audit.jsonl"

          find "stage/freebsd" -type f | sed 's|^stage/freebsd/||' | sort > stage/meta/pkg-plist
          find "stage/freebsd" -type d -empty | sed 's|^stage/freebsd/||' | sort -r | sed 's|^|@dir |' >> stage/meta/pkg-plist

          cat > stage/meta/+MANIFEST <<EOF
          name: ${CI_PACKAGE_NAME}
          version: "${CI_PACKAGE_VERSION}"
          origin: ${CI_PACKAGE_ORIGIN}
          comment: "${CI_PACKAGE_COMMENT}"
          maintainer: ${CI_PACKAGE_MAINTAINER}
          www: ${CI_PACKAGE_WWW}
          prefix: /
          arch: freebsd:14:x86:64
          desc: <<EOD
          ${CI_PACKAGE_DESC}
          EOD
          EOF

          mkdir -p stage/pkg-archive
          cp stage/meta/+MANIFEST stage/pkg-archive/+MANIFEST
          (cd stage/freebsd && tar -cf - .) | (cd stage/pkg-archive && tar -xf -)
          tar -C stage/pkg-archive -c +MANIFEST $(cd stage/pkg-archive && find . -mindepth 1 ! -name +MANIFEST -print | LC_ALL=C sort) | xz -T0 -9e > "dist/${CI_PACKAGE_NAME}-${CI_PACKAGE_VERSION}-freebsd-amd64.pkg"

      - name: Validate package outputs
        shell: sh
        env:
          CI_PACKAGE_NAME: ${{ env.CI_PACKAGE_NAME }}
          CI_PACKAGE_VERSION: ${{ env.CI_PACKAGE_VERSION }}
        run: |
          set -eu
          test -f "dist/${CI_PACKAGE_NAME}_${CI_PACKAGE_VERSION}_amd64.deb"
          test -f "dist/${CI_PACKAGE_NAME}-${CI_PACKAGE_VERSION}-1.x86_64.rpm"
          test -f "dist/${CI_PACKAGE_NAME}-${CI_PACKAGE_VERSION}-freebsd-amd64.pkg"
          tar -tf "dist/${CI_PACKAGE_NAME}-${CI_PACKAGE_VERSION}-freebsd-amd64.pkg" >/dev/null

      - name: Publish release assets
        shell: sh
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
          CI_RELEASE_TAG: ${{ env.CI_RELEASE_TAG }}
        run: |
          set -eu

          ref="${FORGEJO_REF:-${GITHUB_REF:-}}"
          if [ "${ref#refs/tags/}" = "$ref" ]; then
            echo "Not a tag push; skipping release publication."
            exit 0
          fi

          api_url="${FORGEJO_API_URL:-${GITHUB_API_URL:-}}"
          repository="${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY:-}}"
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:-}}"
          auth_header="Authorization: token ${token}"

          if [ -z "$api_url" ] || [ -z "$repository" ] || [ -z "$token" ]; then
            echo "Missing Forgejo release API context." >&2
            exit 1
          fi

          release_url="${api_url%/}/repos/${repository}/releases/tags/${CI_RELEASE_TAG}"
          release_json="$(curl -fsS -H "$auth_header" "$release_url" || true)"

          if [ -z "$release_json" ]; then
            create_url="${api_url%/}/repos/${repository}/releases"
            create_payload="$(jq -n --arg tag "$CI_RELEASE_TAG" --arg name "$CI_RELEASE_TAG" '{tag_name:$tag,name:$name,draft:false,prerelease:false}')"
            release_json="$(curl -fsS -X POST -H "$auth_header" -H 'Content-Type: application/json' -d "$create_payload" "$create_url")"
          fi

          release_id="$(printf '%s' "$release_json" | jq -r '.id')"
          if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
            echo "Failed to resolve Forgejo release id." >&2
            exit 1
          fi

          for asset_path in dist/*; do
            asset_name="$(basename "$asset_path")"
            existing_asset_id="$(printf '%s' "$release_json" | jq -r --arg name "$asset_name" '.assets[]? | select(.name == $name) | .id' | head -n1)"
            if [ -n "$existing_asset_id" ] && [ "$existing_asset_id" != "null" ]; then
              delete_url="${api_url%/}/repos/${repository}/releases/${release_id}/assets/${existing_asset_id}"
              curl -fsS -X DELETE -H "$auth_header" "$delete_url"
            fi

            upload_url="${api_url%/}/repos/${repository}/releases/${release_id}/assets?name=${asset_name}"
            curl -fsS -X POST \
              -H "$auth_header" \
              -H 'Content-Type: application/octet-stream' \
              --data-binary @"$asset_path" \
              "$upload_url"
          done
