  freebsd-aarch64:
    runs-on: freebsd-15
    steps:
      - name: Install FreeBSD build dependencies
        shell: bash
        run: |
          set -eu
          PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${PATH:-}
          export PATH
          log_file="${RUNNER_TEMP:-/tmp}/freebsd-aarch64-install-deps.log"
