      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP:-/tmp}/linux-packages-arm64-rust-toolchain.log"
          exec > >(tee -a "$log_file") 2>&1
