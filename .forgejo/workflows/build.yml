          commit_sha="${FORGEJO_SHA:-${GITHUB_SHA:?Missing commit SHA}}"
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:?Missing Forgejo token}}"
          repo_dir="${RUNNER_TEMP:-/tmp}/centralssh"
          remote_url="${server_url%/}/${repository}.git"
          auth_header="$(printf 'x-access-token:%s' "$token" | base64 | tr -d '\n')"

          rm -rf "$repo_dir"
          git -c "http.${server_url}/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            clone "$remote_url" "$repo_dir"
          git -C "$repo_dir" checkout --detach "$commit_sha"

          printf 'REPO_DIR=%s\n' "$repo_dir" >> "$GITHUB_ENV"

      - name: Build and validate FreeBSD amd64 artifacts
        shell: sh
        run: |
          set -eu
          log_file="${RUNNER_TEMP:-/tmp}/freebsd-amd64.log"
          : > "$log_file"
          exec >>"$log_file" 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then ./ci/post-ci-log.sh "freebsd-amd64/build-and-validate" error "$log_file"; fi' EXIT
          cd "${REPO_DIR:?Missing checkout}"
          if [ ! -x "$HOME/.cargo/bin/rustc" ]; then
            fetch -q -o /tmp/rustup.sh "$RUSTUP_INIT_URL"
            sh /tmp/rustup.sh -y --no-modify-path --default-toolchain "$RUST_TOOLCHAIN"
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          chmod +x ./ci/build-freebsd-native.sh
          ./ci/build-freebsd-native.sh "$(sed -n 's/^version = \"\\(.*\\)\"/\\1/p' Cargo.toml | head -n1)" amd64

