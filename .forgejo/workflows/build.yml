          apt_get="apt-get"
          if command -v sudo >/dev/null 2>&1; then
            apt_get="sudo apt-get"
          fi
          $apt_get update
          $apt_get install -y --no-install-recommends \
            ca-certificates \
            curl \
            gcc \
            g++ \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            libssl-dev \
            git \
            jq \
            make \
            pkg-config \
            rpm \
            dpkg-dev \
            file \
            xz-utils

      - name: Check out repository
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP:-/tmp}/linux-packages-arm64-checkout.log"
          exec > >(tee -a "$log_file") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then { printf "context=%s\nstatus=error\n\n" "linux-packages-arm64/checkout"; grep -Ev "^(    Updating crates\\.io index| Downloading crates \\.\\.\\.|  Downloaded |   Compiling )" "$log_file" | tail -n 250; } | curl --fail --silent --show-error --header "Content-Type: text/plain; charset=utf-8" --data-binary @- "$CI_LOG_ENDPOINT" >/dev/null || true; fi' EXIT

          server_url="${FORGEJO_SERVER_URL:-${GITHUB_SERVER_URL:?Missing server URL}}"
          repository="${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY:?Missing repository name}}"
          commit_sha="${FORGEJO_SHA:-${GITHUB_SHA:?Missing commit SHA}}"
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:?Missing Forgejo token}}"
          repo_dir="${RUNNER_TEMP:-/tmp}/centralssh"
          remote_url="${server_url%/}/${repository}.git"
          auth_header="$(printf 'x-access-token:%s' "$token" | base64 | tr -d '\n')"

          rm -rf "$repo_dir"
          git -c "http.extraHeader=AUTHORIZATION: basic ${auth_header}" \
