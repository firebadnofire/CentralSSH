name: Build FreeBSD Package

on:
  push:
  pull_request:

jobs:
  build-freebsd-package:
    runs-on: ubuntu-22.04
    env:
      GITHUB_WORKSPACE: /root/work
    container:
      image: node:20-bookworm
      options: --network ci-network

    steps:
      - name: Prepare checkout runtime
        shell: sh
        run: |
          set -eu
          {
            echo 'Acquire::http::Proxy "http://apt-cacher-ng:3142";'
            echo 'Acquire::https::Proxy "http://apt-cacher-ng:3142";'
          } > /etc/apt/apt.conf.d/01proxy
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git jq sudo zstd rsync

      - name: Check out repository
        shell: sh
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: |
          set -eu
          server_url="${FORGEJO_SERVER_URL:-${GITHUB_SERVER_URL:-}}"
          repository="${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY:-}}"
          ref="${FORGEJO_REF:-${GITHUB_REF:-}}"
          sha="${FORGEJO_SHA:-${GITHUB_SHA:-}}"
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:-}}"
          remote_url="${server_url%/}/${repository}.git"

          if [ -z "$server_url" ] || [ -z "$repository" ]; then
            echo "Missing Forgejo repository context for checkout." >&2
            exit 1
          fi

          git init .
          git remote add origin "$remote_url"

          if [ -n "$token" ]; then
            auth_header="$(printf 'x-access-token:%s' "$token" | base64 | tr -d '\n')"
            git_fetch() {
              git -c "http.${remote_url}.extraheader=AUTHORIZATION: basic ${auth_header}" "$@"
            }
          else
            git_fetch() {
              git "$@"
            }
          fi

          if [ -n "$ref" ]; then
            git_fetch fetch --force --tags --prune --depth=1 origin "+${ref}:${ref}"
            git checkout --force --detach "$ref"
          elif [ -n "$sha" ]; then
            git_fetch fetch --force --tags --prune --depth=1 origin "$sha"
            git checkout --force --detach "$sha"
          else
            echo "Missing both ref and sha for checkout." >&2
            exit 1
          fi

          git submodule sync --recursive
          git submodule update --init --recursive --depth=1

      - name: Normalize workspace path for FreeBSD VM sync
        shell: sh
        run: |
          set -eu
          actual_workspace="${GITHUB_WORKSPACE:-$PWD}"
          if [ ! -d "$actual_workspace" ]; then
            actual_workspace="$PWD"
          fi

          mkdir -p /root
          if [ ! -e /root/work ]; then
            ln -s "$actual_workspace" /root/work
          fi

      - name: Derive package metadata
        shell: sh
        run: |
          set -eu
          package_name="$(sed -n 's/^name = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          package_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          package_comment="$(sed -n 's/^description = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          repo_path="${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY:-}}"
          server_url="${FORGEJO_SERVER_URL:-${GITHUB_SERVER_URL:-}}"
          repo_url="${server_url%/}/${repo_path}"
          tag_name="${FORGEJO_REF_NAME:-${GITHUB_REF_NAME:-}}"

          {
            echo "CI_PACKAGE_NAME=${package_name}"
            echo "CI_PACKAGE_VERSION=${package_version}"
            echo "CI_PACKAGE_COMMENT=${package_comment}"
            echo "CI_PACKAGE_ORIGIN=security/${package_name}"
            echo "CI_PACKAGE_WWW=${repo_url}"
            echo "CI_PACKAGE_MAINTAINER=root@localhost"
            echo "CI_PACKAGE_DESC=${package_comment}"
            echo "CI_PACKAGE_FILE=dist/${package_name}-${package_version}.pkg"
            echo "CI_RELEASE_TAG=${tag_name}"
          } >> "$GITHUB_ENV"

      - name: Build FreeBSD package
        uses: vmactions/freebsd-vm@v1
        env:
          CI_PACKAGE_NAME: ${{ env.CI_PACKAGE_NAME }}
          CI_PACKAGE_VERSION: ${{ env.CI_PACKAGE_VERSION }}
          CI_PACKAGE_COMMENT: ${{ env.CI_PACKAGE_COMMENT }}
          CI_PACKAGE_ORIGIN: ${{ env.CI_PACKAGE_ORIGIN }}
          CI_PACKAGE_WWW: ${{ env.CI_PACKAGE_WWW }}
          CI_PACKAGE_MAINTAINER: ${{ env.CI_PACKAGE_MAINTAINER }}
          CI_PACKAGE_DESC: ${{ env.CI_PACKAGE_DESC }}
        with:
          release: "14.2"
          usesh: true
          prepare: |
            pkg install -y rust
          run: |
            set -eu

            stage_dir="$PWD/stage"
            meta_dir="$PWD/pkgmeta"
            dist_dir="$PWD/dist"

            rm -rf "$stage_dir" "$meta_dir" "$dist_dir"
            mkdir -p "$stage_dir" "$meta_dir" "$dist_dir"

            cargo build --release
            make install DESTDIR="$stage_dir" PREFIX=/usr/local

            find "$stage_dir" -type f | sed "s|^$stage_dir||" | sort > "$meta_dir/pkg-plist"
            find "$stage_dir" -type d -empty | sed "s|^$stage_dir||" | sort -r | sed 's|^|@dir |' >> "$meta_dir/pkg-plist"

            cat > "$meta_dir/+MANIFEST" <<EOF
            name: ${CI_PACKAGE_NAME}
            version: "${CI_PACKAGE_VERSION}"
            origin: ${CI_PACKAGE_ORIGIN}
            comment: "${CI_PACKAGE_COMMENT}"
            maintainer: ${CI_PACKAGE_MAINTAINER}
            www: ${CI_PACKAGE_WWW}
            prefix: /
            desc: <<EOD
            ${CI_PACKAGE_DESC}
            EOD
            EOF

            pkg create -M "$meta_dir/+MANIFEST" -p "$meta_dir/pkg-plist" -r "$stage_dir" -o "$dist_dir"

      - name: Validate FreeBSD package output
        shell: sh
        env:
          CI_PACKAGE_FILE: ${{ env.CI_PACKAGE_FILE }}
        run: |
          set -eu
          if [ ! -f "$CI_PACKAGE_FILE" ]; then
            echo "Missing expected FreeBSD package: $CI_PACKAGE_FILE" >&2
            exit 1
          fi
          tar -tf "$CI_PACKAGE_FILE" >/dev/null

      - name: Publish release asset
        shell: sh
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
          CI_PACKAGE_FILE: ${{ env.CI_PACKAGE_FILE }}
          CI_RELEASE_TAG: ${{ env.CI_RELEASE_TAG }}
        run: |
          set -eu

          ref="${FORGEJO_REF:-${GITHUB_REF:-}}"
          if [ "${ref#refs/tags/}" = "$ref" ]; then
            echo "Not a tag push; skipping release publication."
            exit 0
          fi

          api_url="${FORGEJO_API_URL:-${GITHUB_API_URL:-}}"
          repository="${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY:-}}"
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:-}}"
          asset_name="$(basename "$CI_PACKAGE_FILE")"
          auth_header="Authorization: token ${token}"

          if [ -z "$api_url" ] || [ -z "$repository" ] || [ -z "$token" ]; then
            echo "Missing Forgejo release API context." >&2
            exit 1
          fi

          release_url="${api_url%/}/repos/${repository}/releases/tags/${CI_RELEASE_TAG}"
          release_json="$(curl -fsS -H "$auth_header" "$release_url" || true)"

          if [ -z "$release_json" ]; then
            create_url="${api_url%/}/repos/${repository}/releases"
            create_payload="$(jq -n --arg tag "$CI_RELEASE_TAG" --arg name "$CI_RELEASE_TAG" '{tag_name:$tag,name:$name,draft:false,prerelease:false}')"
            release_json="$(curl -fsS -X POST -H "$auth_header" -H 'Content-Type: application/json' -d "$create_payload" "$create_url")"
          fi

          release_id="$(printf '%s' "$release_json" | jq -r '.id')"
          if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
            echo "Failed to resolve Forgejo release id." >&2
            exit 1
          fi

          existing_asset_id="$(printf '%s' "$release_json" | jq -r --arg name "$asset_name" '.assets[]? | select(.name == $name) | .id' | head -n1)"
          if [ -n "$existing_asset_id" ] && [ "$existing_asset_id" != "null" ]; then
            delete_url="${api_url%/}/repos/${repository}/releases/${release_id}/assets/${existing_asset_id}"
            curl -fsS -X DELETE -H "$auth_header" "$delete_url"
          fi

          upload_url="${api_url%/}/repos/${repository}/releases/${release_id}/assets?name=${asset_name}"
          curl -fsS -X POST \
            -H "$auth_header" \
            -H 'Content-Type: application/octet-stream' \
            --data-binary @"$CI_PACKAGE_FILE" \
            "$upload_url"
