name: centralssh-build

on:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "v*"
      - "V*"

env:
  RUST_TOOLCHAIN: "1.95.0"
  RUSTUP_INIT_URL: "https://sh.rustup.rs"

jobs:
  linux-build-test:
    runs-on: ubuntu-22.04
    steps:
      - name: Install host dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt_get="apt-get"
          if command -v sudo >/dev/null 2>&1; then
            apt_get="sudo apt-get"
          fi
          $apt_get update
          $apt_get install -y --no-install-recommends \
            ca-certificates \
            curl \
            gcc \
            g++ \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            git \
            make \
            netcat-openbsd \
            pkg-config \
            rpm \
            dpkg-dev \
            file \
            xz-utils \
            systemd

      - name: Check out repository
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: |
          set -euo pipefail

          server_url="${FORGEJO_SERVER_URL:-${GITHUB_SERVER_URL:?Missing server URL}}"
          repository="${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY:?Missing repository name}}"
          commit_sha="${FORGEJO_SHA:-${GITHUB_SHA:?Missing commit SHA}}"
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:?Missing Forgejo token}}"
          repo_dir="${RUNNER_TEMP:-/tmp}/centralssh"
          remote_url="${server_url%/}/${repository}.git"
          auth_header="$(printf 'x-access-token:%s' "$token" | base64 | tr -d '\n')"

          rm -rf "$repo_dir"
          git -c "http.${server_url}/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            clone "$remote_url" "$repo_dir"
          git -C "$repo_dir" checkout --detach "$commit_sha"

          printf 'REPO_DIR=%s\n' "$repo_dir" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$RUSTUP_INIT_URL" -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --default-toolchain "$RUST_TOOLCHAIN" --profile minimal
          printf '%s\n' "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustc" --version
          "$HOME/.cargo/bin/cargo" --version

      - name: Configure Cargo cache
        shell: bash
        run: |
          set -euo pipefail
          cd "${REPO_DIR:?Missing checkout}"
          eval "$(./ci/cache-env.sh linux-build-test release x86_64-unknown-linux-gnu /build-cache)"
          ./ci/install-sccache.sh
          if command -v sccache >/dev/null 2>&1; then
            export RUSTC_WRAPPER="$(command -v sccache)"
          fi
          ./ci/log-rust-cache-stats.sh

      - name: Validate version and lockfile
        shell: bash
        run: |
          set -euo pipefail
          cd "${REPO_DIR:?Missing checkout}"
          cargo metadata --format-version 1 --locked >/dev/null
          repo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          ref_name="${FORGEJO_REF_NAME:-${GITHUB_REF_NAME:-}}"
          ref_type="${FORGEJO_REF_TYPE:-${GITHUB_REF_TYPE:-}}"
          if [ "$ref_type" = "tag" ] && [ -n "$ref_name" ]; then
            tag_version="${ref_name#v}"
            tag_version="${tag_version#V}"
            if [ "$tag_version" != "$repo_version" ]; then
              echo "tag version (${tag_version}) does not match Cargo.toml version (${repo_version})" >&2
              exit 1
            fi
          fi

      - name: Build and test host target
        shell: bash
        run: |
          set -euo pipefail
          cd "${REPO_DIR:?Missing checkout}"
          export PATH="$HOME/.cargo/bin:$PATH"
          eval "$(./ci/cache-env.sh linux-build-test release x86_64-unknown-linux-gnu /build-cache)"
          if command -v sccache >/dev/null 2>&1; then
            export RUSTC_WRAPPER="$(command -v sccache)"
          fi
          cargo fetch --locked
          cargo test --locked
          cargo build --locked --release
          make -n install >/dev/null
          ./ci/log-rust-cache-stats.sh

  linux-packages-amd64:
    runs-on: ubuntu-22.04
    needs: linux-build-test
    steps:
      - name: Install host dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt_get="apt-get"
          if command -v sudo >/dev/null 2>&1; then
            apt_get="sudo apt-get"
          fi
          $apt_get update
          $apt_get install -y --no-install-recommends \
            ca-certificates \
            curl \
            gcc \
            g++ \
            libc6-dev-arm64-cross \
            git \
            make \
            netcat-openbsd \
            pkg-config \
            rpm \
            dpkg-dev \
            file \
            xz-utils \
            systemd

      - name: Check out repository
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: |
          set -euo pipefail

          server_url="${FORGEJO_SERVER_URL:-${GITHUB_SERVER_URL:?Missing server URL}}"
          repository="${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY:?Missing repository name}}"
          commit_sha="${FORGEJO_SHA:-${GITHUB_SHA:?Missing commit SHA}}"
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:?Missing Forgejo token}}"
          repo_dir="${RUNNER_TEMP:-/tmp}/centralssh"
          remote_url="${server_url%/}/${repository}.git"
          auth_header="$(printf 'x-access-token:%s' "$token" | base64 | tr -d '\n')"

          rm -rf "$repo_dir"
          git -c "http.${server_url}/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            clone "$remote_url" "$repo_dir"
          git -C "$repo_dir" checkout --detach "$commit_sha"

          printf 'REPO_DIR=%s\n' "$repo_dir" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$RUSTUP_INIT_URL" -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --default-toolchain "$RUST_TOOLCHAIN" --profile minimal
          printf '%s\n' "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" target add x86_64-unknown-linux-gnu

      - name: Build Linux amd64 packages
        shell: bash
        run: |
          set -euo pipefail
          cd "${REPO_DIR:?Missing checkout}"
          export PATH="$HOME/.cargo/bin:$PATH"
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          ./ci/package-linux.sh "$version" amd64
          ./ci/validate-linux-packages.sh "$version" amd64

  linux-packages-arm64:
    runs-on: ubuntu-22.04
    needs: linux-build-test
    steps:
      - name: Install host dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt_get="apt-get"
          if command -v sudo >/dev/null 2>&1; then
            apt_get="sudo apt-get"
          fi
          $apt_get update
          $apt_get install -y --no-install-recommends \
            ca-certificates \
            curl \
            gcc \
            g++ \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            git \
            make \
            pkg-config \
            rpm \
            dpkg-dev \
            file \
            xz-utils

      - name: Check out repository
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: |
          set -euo pipefail

          server_url="${FORGEJO_SERVER_URL:-${GITHUB_SERVER_URL:?Missing server URL}}"
          repository="${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY:?Missing repository name}}"
          commit_sha="${FORGEJO_SHA:-${GITHUB_SHA:?Missing commit SHA}}"
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:?Missing Forgejo token}}"
          repo_dir="${RUNNER_TEMP:-/tmp}/centralssh"
          remote_url="${server_url%/}/${repository}.git"
          auth_header="$(printf 'x-access-token:%s' "$token" | base64 | tr -d '\n')"

          rm -rf "$repo_dir"
          git -c "http.${server_url}/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            clone "$remote_url" "$repo_dir"
          git -C "$repo_dir" checkout --detach "$commit_sha"

          printf 'REPO_DIR=%s\n' "$repo_dir" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$RUSTUP_INIT_URL" -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --default-toolchain "$RUST_TOOLCHAIN" --profile minimal
          printf '%s\n' "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" target add aarch64-unknown-linux-gnu

      - name: Build Linux arm64 packages
        shell: bash
        run: |
          set -euo pipefail
          cd "${REPO_DIR:?Missing checkout}"
          export PATH="$HOME/.cargo/bin:$PATH"
          export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          ./ci/package-linux.sh "$version" arm64
          ./ci/validate-linux-packages.sh "$version" arm64

  freebsd-amd64:
    runs-on: ubuntu-22.04
    needs: linux-build-test
    steps:
      - name: Install FreeBSD build dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt_get="apt-get"
          if command -v sudo >/dev/null 2>&1; then
            apt_get="sudo apt-get"
          fi
          $apt_get update
          $apt_get install -y --no-install-recommends \
            ca-certificates \
            curl \
            genisoimage \
            git \
            openssh-client \
            qemu-system-x86 \
            qemu-utils \
            xz-utils

      - name: Check out repository
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: |
          set -euo pipefail

          server_url="${FORGEJO_SERVER_URL:-${GITHUB_SERVER_URL:?Missing server URL}}"
          repository="${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY:?Missing repository name}}"
          commit_sha="${FORGEJO_SHA:-${GITHUB_SHA:?Missing commit SHA}}"
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:?Missing Forgejo token}}"
          repo_dir="${RUNNER_TEMP:-/tmp}/centralssh"
          remote_url="${server_url%/}/${repository}.git"
          auth_header="$(printf 'x-access-token:%s' "$token" | base64 | tr -d '\n')"

          rm -rf "$repo_dir"
          git -c "http.${server_url}/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            clone "$remote_url" "$repo_dir"
          git -C "$repo_dir" checkout --detach "$commit_sha"

          printf 'REPO_DIR=%s\n' "$repo_dir" >> "$GITHUB_ENV"

      - name: Build and validate FreeBSD amd64 artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd "${REPO_DIR:?Missing checkout}"
          chmod +x ./ci/freebsd-qemu-build.sh
          ./ci/freebsd-qemu-build.sh build amd64

  freebsd-aarch64:
    runs-on: ubuntu-22.04
    needs: linux-build-test
    steps:
      - name: Install FreeBSD build dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt_get="apt-get"
          if command -v sudo >/dev/null 2>&1; then
            apt_get="sudo apt-get"
          fi
          $apt_get update
          $apt_get install -y --no-install-recommends \
            ca-certificates \
            curl \
            genisoimage \
            git \
            openssh-client \
            qemu-efi-aarch64 \
            qemu-system-arm \
            qemu-utils \
            xz-utils

      - name: Check out repository
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: |
          set -euo pipefail

          server_url="${FORGEJO_SERVER_URL:-${GITHUB_SERVER_URL:?Missing server URL}}"
          repository="${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY:?Missing repository name}}"
          commit_sha="${FORGEJO_SHA:-${GITHUB_SHA:?Missing commit SHA}}"
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:?Missing Forgejo token}}"
          repo_dir="${RUNNER_TEMP:-/tmp}/centralssh"
          remote_url="${server_url%/}/${repository}.git"
          auth_header="$(printf 'x-access-token:%s' "$token" | base64 | tr -d '\n')"

          rm -rf "$repo_dir"
          git -c "http.${server_url}/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            clone "$remote_url" "$repo_dir"
          git -C "$repo_dir" checkout --detach "$commit_sha"

          printf 'REPO_DIR=%s\n' "$repo_dir" >> "$GITHUB_ENV"

      - name: Build and validate FreeBSD aarch64 artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd "${REPO_DIR:?Missing checkout}"
          chmod +x ./ci/freebsd-qemu-build.sh
          ./ci/freebsd-qemu-build.sh build aarch64
