name: centralssh-build

on:
  push:
    tags:
      - "v*"

env:
  RUST_TOOLCHAIN: "1.95.0"
  RUSTUP_INIT_URL: "https://sh.rustup.rs"
  CI_LOG_ENDPOINT: "http://192.168.86.41:9000/ingest"

jobs:
  linux-build-test:
    runs-on: ubuntu-22.04
    steps:
      - name: Install host dependencies
        shell: bash
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP:-/tmp}/linux-build-test-install-deps.log"
          exec > >(tee -a "$log_file") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then { printf "context=%s\nstatus=error\n\n" "linux-build-test/install-deps"; grep -Ev "^(    Updating crates\\.io index| Downloading crates \\.\\.\\.|  Downloaded |   Compiling )" "$log_file" | tail -n 250; } | curl --fail --silent --show-error --header "Content-Type: text/plain; charset=utf-8" --data-binary @- "$CI_LOG_ENDPOINT" >/dev/null || true; fi' EXIT
          apt_get="apt-get"
          if command -v sudo >/dev/null 2>&1; then
            apt_get="sudo apt-get"
          fi
          $apt_get update
          $apt_get install -y --no-install-recommends \
            ca-certificates \
            curl \
            gcc \
            g++ \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            git \
            make \
            netcat-openbsd \
            pkg-config \
            rpm \
            dpkg-dev \
            file \
            xz-utils \
            systemd

      - name: Check out repository
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP:-/tmp}/linux-build-test-checkout.log"
          exec > >(tee -a "$log_file") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then { printf "context=%s\nstatus=error\n\n" "linux-build-test/checkout"; grep -Ev "^(    Updating crates\\.io index| Downloading crates \\.\\.\\.|  Downloaded |   Compiling )" "$log_file" | tail -n 250; } | curl --fail --silent --show-error --header "Content-Type: text/plain; charset=utf-8" --data-binary @- "$CI_LOG_ENDPOINT" >/dev/null || true; fi' EXIT

          server_url="${FORGEJO_SERVER_URL:-${GITHUB_SERVER_URL:?Missing server URL}}"
          repository="${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY:?Missing repository name}}"
          commit_sha="${FORGEJO_SHA:-${GITHUB_SHA:?Missing commit SHA}}"
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:?Missing Forgejo token}}"
          repo_dir="${RUNNER_TEMP:-/tmp}/centralssh"
          remote_url="${server_url%/}/${repository}.git"
          auth_header="$(printf 'x-access-token:%s' "$token" | base64 | tr -d '\n')"

          rm -rf "$repo_dir"
          git -c "http.${server_url}/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            clone "$remote_url" "$repo_dir"
          git -C "$repo_dir" checkout --detach "$commit_sha"

          printf 'REPO_DIR=%s\n' "$repo_dir" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP:-/tmp}/linux-build-test-rust-toolchain.log"
          exec > >(tee -a "$log_file") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then { printf "context=%s\nstatus=error\n\n" "linux-build-test/install-rust"; grep -Ev "^(    Updating crates\\.io index| Downloading crates \\.\\.\\.|  Downloaded |   Compiling )" "$log_file" | tail -n 250; } | curl --fail --silent --show-error --header "Content-Type: text/plain; charset=utf-8" --data-binary @- "$CI_LOG_ENDPOINT" >/dev/null || true; fi' EXIT
          curl --fail --silent --show-error --location "$RUSTUP_INIT_URL" -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --default-toolchain "$RUST_TOOLCHAIN" --profile minimal
          printf '%s\n' "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustc" --version
          "$HOME/.cargo/bin/cargo" --version

      - name: Configure Cargo cache
        shell: bash
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP:-/tmp}/linux-build-test-cache.log"
          exec > >(tee -a "$log_file") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then ./ci/post-ci-log.sh "linux-build-test/configure-cache" error "$log_file"; fi' EXIT
          cd "${REPO_DIR:?Missing checkout}"
          eval "$(./ci/cache-env.sh linux-build-test release x86_64-unknown-linux-gnu /build-cache)"
          ./ci/install-sccache.sh
          if command -v sccache >/dev/null 2>&1; then
            export RUSTC_WRAPPER="$(command -v sccache)"
          fi
          ./ci/log-rust-cache-stats.sh

      - name: Validate lockfile
        shell: bash
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP:-/tmp}/linux-build-test-validate.log"
          exec > >(tee -a "$log_file") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then ./ci/post-ci-log.sh "linux-build-test/validate-version" error "$log_file"; fi' EXIT
          cd "${REPO_DIR:?Missing checkout}"
          cargo fetch --locked >/dev/null

      - name: Build and test host target
        shell: bash
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP:-/tmp}/linux-build-test.log"
          exec > >(tee -a "$log_file") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then ./ci/post-ci-log.sh "linux-build-test/build-and-test" error "$log_file"; fi' EXIT
          cd "${REPO_DIR:?Missing checkout}"
          export PATH="$HOME/.cargo/bin:$PATH"
          eval "$(./ci/cache-env.sh linux-build-test release x86_64-unknown-linux-gnu /build-cache)"
          if command -v sccache >/dev/null 2>&1; then
            export RUSTC_WRAPPER="$(command -v sccache)"
          fi
          cargo fetch --locked
          cargo test --locked
          cargo build --locked --release
          make -n install >/dev/null
          ./ci/log-rust-cache-stats.sh

  release-setup:
    runs-on: ubuntu-22.04
    steps:
      - name: Install release setup dependencies
        shell: bash
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP:-/tmp}/release-setup-install-deps.log"
          exec > >(tee -a "$log_file") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then { printf "context=%s\nstatus=error\n\n" "release-setup/install-deps"; grep -Ev "^(    Updating crates\\.io index| Downloading crates \\.\\.\\.|  Downloaded |   Compiling )" "$log_file" | tail -n 250; } | curl --fail --silent --show-error --header "Content-Type: text/plain; charset=utf-8" --data-binary @- "$CI_LOG_ENDPOINT" >/dev/null || true; fi' EXIT
          apt_get="apt-get"
          if command -v sudo >/dev/null 2>&1; then
            apt_get="sudo apt-get"
          fi
          $apt_get update
          $apt_get install -y --no-install-recommends ca-certificates curl jq

      - name: Ensure Forgejo draft release exists
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP:-/tmp}/release-setup-ensure-release.log"
          exec > >(tee -a "$log_file") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then { printf "context=%s\nstatus=error\n\n" "release-setup/ensure-draft-release"; grep -Ev "^(    Updating crates\\.io index| Downloading crates \\.\\.\\.|  Downloaded |   Compiling )" "$log_file" | tail -n 250; } | curl --fail --silent --show-error --header "Content-Type: text/plain; charset=utf-8" --data-binary @- "$CI_LOG_ENDPOINT" >/dev/null || true; fi' EXIT

          api_url="${FORGEJO_API_URL:-${GITHUB_API_URL:?Missing Forgejo API URL}}"
          repository="${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY:?Missing repository name}}"
          tag="${FORGEJO_REF_NAME:-${GITHUB_REF_NAME:?Missing tag ref name}}"
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:?Missing Forgejo token}}"
          owner="${repository%%/*}"
          repo="${repository#*/}"
          release_name="CentralSSH ${tag}"
          release_body="Automated CentralSSH draft release for ${tag}. This remains unpublished until every required pipeline succeeds."

          api_request() {
            local method="$1"
            local url="$2"
            shift 2
            curl --fail-with-body --silent --show-error \
              --request "$method" \
              --header "Authorization: token ${token}" \
              "$@" \
              "$url"
          }

          release_response="$(mktemp)"
          release_status="$(curl --silent --show-error \
            --output "$release_response" \
            --write-out "%{http_code}" \
            --header "Authorization: token ${token}" \
            "${api_url}/repos/${owner}/${repo}/releases/tags/${tag}")"

          if [ "$release_status" = "404" ]; then
            release_payload="$(jq -n \
              --arg tag "$tag" \
              --arg name "$release_name" \
              --arg body "$release_body" \
              '{tag_name: $tag, name: $name, body: $body, draft: true, prerelease: false, hide_archive_links: false}')"
            api_request POST "${api_url}/repos/${owner}/${repo}/releases" \
              --header "Content-Type: application/json" \
              --data "$release_payload" >/dev/null
          elif [ "$release_status" != "200" ]; then
            cat "$release_response" >&2
            echo "Failed to look up release for ${tag}: HTTP ${release_status}" >&2
            exit 1
          fi

  linux-packages-amd64:
    runs-on: ubuntu-22.04
    needs:
      - linux-build-test
      - release-setup
    steps:
      - name: Install host dependencies
        shell: bash
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP:-/tmp}/linux-packages-amd64-install-deps.log"
          exec > >(tee -a "$log_file") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then { printf "context=%s\nstatus=error\n\n" "linux-packages-amd64/install-deps"; grep -Ev "^(    Updating crates\\.io index| Downloading crates \\.\\.\\.|  Downloaded |   Compiling )" "$log_file" | tail -n 250; } | curl --fail --silent --show-error --header "Content-Type: text/plain; charset=utf-8" --data-binary @- "$CI_LOG_ENDPOINT" >/dev/null || true; fi' EXIT
          apt_get="apt-get"
          if command -v sudo >/dev/null 2>&1; then
            apt_get="sudo apt-get"
          fi
          $apt_get update
          $apt_get install -y --no-install-recommends \
            ca-certificates \
            curl \
            gcc \
            g++ \
            libc6-dev-arm64-cross \
            git \
            jq \
            make \
            netcat-openbsd \
            pkg-config \
            rpm \
            dpkg-dev \
            file \
            xz-utils \
            systemd

      - name: Check out repository
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP:-/tmp}/linux-packages-amd64-checkout.log"
          exec > >(tee -a "$log_file") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then { printf "context=%s\nstatus=error\n\n" "linux-packages-amd64/checkout"; grep -Ev "^(    Updating crates\\.io index| Downloading crates \\.\\.\\.|  Downloaded |   Compiling )" "$log_file" | tail -n 250; } | curl --fail --silent --show-error --header "Content-Type: text/plain; charset=utf-8" --data-binary @- "$CI_LOG_ENDPOINT" >/dev/null || true; fi' EXIT

          server_url="${FORGEJO_SERVER_URL:-${GITHUB_SERVER_URL:?Missing server URL}}"
          repository="${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY:?Missing repository name}}"
          commit_sha="${FORGEJO_SHA:-${GITHUB_SHA:?Missing commit SHA}}"
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:?Missing Forgejo token}}"
          repo_dir="${RUNNER_TEMP:-/tmp}/centralssh"
          remote_url="${server_url%/}/${repository}.git"
          auth_header="$(printf 'x-access-token:%s' "$token" | base64 | tr -d '\n')"

          rm -rf "$repo_dir"
          git -c "http.${server_url}/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            clone "$remote_url" "$repo_dir"
          git -C "$repo_dir" checkout --detach "$commit_sha"

          printf 'REPO_DIR=%s\n' "$repo_dir" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP:-/tmp}/linux-packages-amd64-rust-toolchain.log"
          exec > >(tee -a "$log_file") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then { printf "context=%s\nstatus=error\n\n" "linux-packages-amd64/install-rust"; grep -Ev "^(    Updating crates\\.io index| Downloading crates \\.\\.\\.|  Downloaded |   Compiling )" "$log_file" | tail -n 250; } | curl --fail --silent --show-error --header "Content-Type: text/plain; charset=utf-8" --data-binary @- "$CI_LOG_ENDPOINT" >/dev/null || true; fi' EXIT
          curl --fail --silent --show-error --location "$RUSTUP_INIT_URL" -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --default-toolchain "$RUST_TOOLCHAIN" --profile minimal
          printf '%s\n' "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" target add x86_64-unknown-linux-gnu

      - name: Build Linux amd64 packages
        shell: bash
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP:-/tmp}/linux-packages-amd64.log"
          exec > >(tee -a "$log_file") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then ./ci/post-ci-log.sh "linux-packages-amd64/build-and-validate" error "$log_file"; fi' EXIT
          cd "${REPO_DIR:?Missing checkout}"
          export PATH="$HOME/.cargo/bin:$PATH"
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          ./ci/package-linux.sh "$version" amd64
          ./ci/validate-linux-packages.sh "$version" amd64

      - name: Upload Linux amd64 artifacts
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP:-/tmp}/linux-packages-amd64-upload.log"
          exec > >(tee -a "$log_file") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then ./ci/post-ci-log.sh "linux-packages-amd64/upload-artifacts" error "$log_file"; fi' EXIT
          cd "${REPO_DIR:?Missing checkout}"

          api_url="${FORGEJO_API_URL:-${GITHUB_API_URL:?Missing Forgejo API URL}}"
          repository="${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY:?Missing repository name}}"
          tag="${FORGEJO_REF_NAME:-${GITHUB_REF_NAME:?Missing tag ref name}}"
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:?Missing Forgejo token}}"
          owner="${repository%%/*}"
          repo="${repository#*/}"

          api_request() {
            local method="$1"
            local url="$2"
            shift 2
            curl --fail-with-body --silent --show-error \
              --request "$method" \
              --header "Authorization: token ${token}" \
              "$@" \
              "$url"
          }

          release_json="$(api_request GET "${api_url}/repos/${owner}/${repo}/releases/tags/${tag}")"
          release_id="$(printf '%s' "$release_json" | jq -r '.id')"
          [ -n "$release_id" ] && [ "$release_id" != "null" ]

          upload_asset() {
            local asset_path="$1"
            local asset_name
            local asset_name_encoded
            local existing_asset_id
            asset_name="$(basename "$asset_path")"
            asset_name_encoded="$(jq -nr --arg value "$asset_name" '$value|@uri')"
            existing_asset_id="$(api_request GET "${api_url}/repos/${owner}/${repo}/releases/${release_id}/assets" \
              | jq -r --arg name "$asset_name" '.[] | select(.name == $name) | .id' \
              | head -n 1)"
            if [ -n "$existing_asset_id" ]; then
              api_request DELETE "${api_url}/repos/${owner}/${repo}/releases/${release_id}/assets/${existing_asset_id}" >/dev/null
            fi
            api_request POST "${api_url}/repos/${owner}/${repo}/releases/${release_id}/assets?name=${asset_name_encoded}" \
              --form "attachment=@${asset_path}" >/dev/null
          }

          find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.deb' -o -name '*.rpm' \) | sort |
          while IFS= read -r asset_path; do
            [ -n "$asset_path" ] || continue
            upload_asset "$asset_path"
          done

  linux-packages-arm64:
    runs-on: ubuntu-22.04
    needs:
      - linux-build-test
      - release-setup
    steps:
      - name: Install host dependencies
        shell: bash
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP:-/tmp}/linux-packages-arm64-install-deps.log"
          exec > >(tee -a "$log_file") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then { printf "context=%s\nstatus=error\n\n" "linux-packages-arm64/install-deps"; grep -Ev "^(    Updating crates\\.io index| Downloading crates \\.\\.\\.|  Downloaded |   Compiling )" "$log_file" | tail -n 250; } | curl --fail --silent --show-error --header "Content-Type: text/plain; charset=utf-8" --data-binary @- "$CI_LOG_ENDPOINT" >/dev/null || true; fi' EXIT
          apt_get="apt-get"
          if command -v sudo >/dev/null 2>&1; then
            apt_get="sudo apt-get"
          fi
          $apt_get update
          $apt_get install -y --no-install-recommends \
            ca-certificates \
            curl \
            gcc \
            g++ \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            git \
            jq \
            make \
            pkg-config \
            rpm \
            dpkg-dev \
            file \
            xz-utils

      - name: Check out repository
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP:-/tmp}/linux-packages-arm64-checkout.log"
          exec > >(tee -a "$log_file") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then { printf "context=%s\nstatus=error\n\n" "linux-packages-arm64/checkout"; grep -Ev "^(    Updating crates\\.io index| Downloading crates \\.\\.\\.|  Downloaded |   Compiling )" "$log_file" | tail -n 250; } | curl --fail --silent --show-error --header "Content-Type: text/plain; charset=utf-8" --data-binary @- "$CI_LOG_ENDPOINT" >/dev/null || true; fi' EXIT

          server_url="${FORGEJO_SERVER_URL:-${GITHUB_SERVER_URL:?Missing server URL}}"
          repository="${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY:?Missing repository name}}"
          commit_sha="${FORGEJO_SHA:-${GITHUB_SHA:?Missing commit SHA}}"
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:?Missing Forgejo token}}"
          repo_dir="${RUNNER_TEMP:-/tmp}/centralssh"
          remote_url="${server_url%/}/${repository}.git"
          auth_header="$(printf 'x-access-token:%s' "$token" | base64 | tr -d '\n')"

          rm -rf "$repo_dir"
          git -c "http.${server_url}/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            clone "$remote_url" "$repo_dir"
          git -C "$repo_dir" checkout --detach "$commit_sha"

          printf 'REPO_DIR=%s\n' "$repo_dir" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP:-/tmp}/linux-packages-arm64-rust-toolchain.log"
          exec > >(tee -a "$log_file") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then { printf "context=%s\nstatus=error\n\n" "linux-packages-arm64/install-rust"; grep -Ev "^(    Updating crates\\.io index| Downloading crates \\.\\.\\.|  Downloaded |   Compiling )" "$log_file" | tail -n 250; } | curl --fail --silent --show-error --header "Content-Type: text/plain; charset=utf-8" --data-binary @- "$CI_LOG_ENDPOINT" >/dev/null || true; fi' EXIT
          curl --fail --silent --show-error --location "$RUSTUP_INIT_URL" -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --default-toolchain "$RUST_TOOLCHAIN" --profile minimal
          printf '%s\n' "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" target add aarch64-unknown-linux-gnu

      - name: Build Linux arm64 packages
        shell: bash
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP:-/tmp}/linux-packages-arm64.log"
          exec > >(tee -a "$log_file") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then ./ci/post-ci-log.sh "linux-packages-arm64/build-and-validate" error "$log_file"; fi' EXIT
          cd "${REPO_DIR:?Missing checkout}"
          export PATH="$HOME/.cargo/bin:$PATH"
          export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          ./ci/package-linux.sh "$version" arm64
          ./ci/validate-linux-packages.sh "$version" arm64

      - name: Upload Linux arm64 artifacts
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP:-/tmp}/linux-packages-arm64-upload.log"
          exec > >(tee -a "$log_file") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then ./ci/post-ci-log.sh "linux-packages-arm64/upload-artifacts" error "$log_file"; fi' EXIT
          cd "${REPO_DIR:?Missing checkout}"

          api_url="${FORGEJO_API_URL:-${GITHUB_API_URL:?Missing Forgejo API URL}}"
          repository="${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY:?Missing repository name}}"
          tag="${FORGEJO_REF_NAME:-${GITHUB_REF_NAME:?Missing tag ref name}}"
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:?Missing Forgejo token}}"
          owner="${repository%%/*}"
          repo="${repository#*/}"

          api_request() {
            local method="$1"
            local url="$2"
            shift 2
            curl --fail-with-body --silent --show-error \
              --request "$method" \
              --header "Authorization: token ${token}" \
              "$@" \
              "$url"
          }

          release_json="$(api_request GET "${api_url}/repos/${owner}/${repo}/releases/tags/${tag}")"
          release_id="$(printf '%s' "$release_json" | jq -r '.id')"
          [ -n "$release_id" ] && [ "$release_id" != "null" ]

          upload_asset() {
            local asset_path="$1"
            local asset_name
            local asset_name_encoded
            local existing_asset_id
            asset_name="$(basename "$asset_path")"
            asset_name_encoded="$(jq -nr --arg value "$asset_name" '$value|@uri')"
            existing_asset_id="$(api_request GET "${api_url}/repos/${owner}/${repo}/releases/${release_id}/assets" \
              | jq -r --arg name "$asset_name" '.[] | select(.name == $name) | .id' \
              | head -n 1)"
            if [ -n "$existing_asset_id" ]; then
              api_request DELETE "${api_url}/repos/${owner}/${repo}/releases/${release_id}/assets/${existing_asset_id}" >/dev/null
            fi
            api_request POST "${api_url}/repos/${owner}/${repo}/releases/${release_id}/assets?name=${asset_name_encoded}" \
              --form "attachment=@${asset_path}" >/dev/null
          }

          find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.deb' -o -name '*.rpm' \) | sort |
          while IFS= read -r asset_path; do
            [ -n "$asset_path" ] || continue
            upload_asset "$asset_path"
          done

  freebsd-build-test:
    runs-on: freebsd
    steps:
      - name: Install FreeBSD test dependencies
        shell: bash
        run: |
          set -eu
          PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${PATH:-}
          export PATH
