name: Package Releases

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-22.04
    container:
      image: rust:1.89-bookworm
      options: --network ci-network
    env:
      CI_PACKAGE_NAME: centralssh
      CI_PACKAGE_VERSION: 0.0.0
      CI_PACKAGE_COMMENT: Centralized SSH management
      CI_PACKAGE_ORIGIN: security/centralssh
      CI_PACKAGE_WWW: https://example.com
      CI_PACKAGE_MAINTAINER: root@localhost
      CI_PACKAGE_DESC: Centralized SSH management
      CI_RELEASE_TAG: ''
    steps:
      - name: Prepare checkout runtime
        shell: sh
        run: |
          set -eu
          {
            echo 'Acquire::http::Proxy "http://apt-cacher-ng:3142";'
            echo 'Acquire::https::Proxy "http://apt-cacher-ng:3142";'
          } > /etc/apt/apt.conf.d/01proxy
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git jq make dpkg-dev rpm xz-utils file pkg-config clang lld python3 python3-pip

      - name: Check out repository
        shell: sh
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN || secrets.GITHUB_TOKEN || '' }}
        run: |
          set -eu
          server_url="${FORGEJO_SERVER_URL:-${GITHUB_SERVER_URL:-}}"
          repository="${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY:-}}"
          ref="${FORGEJO_REF:-${GITHUB_REF:-}}"
          sha="${FORGEJO_SHA:-${GITHUB_SHA:-}}"
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:-}}"
          remote_url="${server_url%/}/${repository}.git"

          if [ -z "$server_url" ] || [ -z "$repository" ]; then
            echo "Missing server context for checkout." >&2
            exit 1
          fi

          git init .
          git remote add origin "$remote_url"

          if [ -n "$token" ]; then
            auth_header="$(printf 'x-access-token:%s' "$token" | base64 | tr -d '\n')"
            git_fetch() {
              git -c "http.${remote_url}.extraheader=AUTHORIZATION: basic ${auth_header}" "$@"
            }
          else
            git_fetch() {
              git "$@"
            }
          fi

          if [ -n "$ref" ]; then
            git_fetch fetch --force --tags --prune --depth=1 origin "+${ref}:${ref}"
            git checkout --force --detach "$ref"
          elif [ -n "$sha" ]; then
            git_fetch fetch --force --tags --prune --depth=1 origin "$sha"
            git checkout --force --detach "$sha"
          else
            echo "Missing both ref and sha for checkout." >&2
            exit 1
          fi

          git submodule sync --recursive
          git submodule update --init --recursive --depth=1

      - name: Derive package metadata
        shell: sh
        run: |
          set -eu
          package_name="$(sed -n 's/^name = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          package_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          package_comment="$(sed -n 's/^description = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          repo_path="${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY:-}}"
          server_url="${FORGEJO_SERVER_URL:-${GITHUB_SERVER_URL:-}}"
          repo_url="${server_url%/}/${repo_path}"
          tag_name="${FORGEJO_REF_NAME:-${GITHUB_REF_NAME:-}}"

          {
            echo "CI_PACKAGE_NAME=${package_name}"
            echo "CI_PACKAGE_VERSION=${package_version}"
            echo "CI_PACKAGE_COMMENT=${package_comment}"
            echo "CI_PACKAGE_ORIGIN=security/${package_name}"
            echo "CI_PACKAGE_WWW=${repo_url}"
            echo "CI_PACKAGE_MAINTAINER=root@localhost"
            echo "CI_PACKAGE_DESC=${package_comment}"
            echo "CI_RELEASE_TAG=${tag_name}"
          } >> "$GITHUB_ENV"

      - name: Build Linux packages
        shell: sh
        env:
          CI_PACKAGE_NAME: ${{ env.CI_PACKAGE_NAME }}
          CI_PACKAGE_VERSION: ${{ env.CI_PACKAGE_VERSION }}
          CI_PACKAGE_COMMENT: ${{ env.CI_PACKAGE_COMMENT }}
          CI_PACKAGE_ORIGIN: ${{ env.CI_PACKAGE_ORIGIN }}
          CI_PACKAGE_WWW: ${{ env.CI_PACKAGE_WWW }}
          CI_PACKAGE_MAINTAINER: ${{ env.CI_PACKAGE_MAINTAINER }}
          CI_PACKAGE_DESC: ${{ env.CI_PACKAGE_DESC }}
        run: |
          set -eu

          mkdir -p dist
          mkdir -p stage/linux stage/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}

          cargo build --release
          make install DESTDIR="$PWD/stage/linux" PREFIX=/usr

          # --- .deb ---
          mkdir -p stage/linux/DEBIAN
          cat > stage/linux/DEBIAN/control <<EOF
          Package: ${CI_PACKAGE_NAME}
          Version: ${CI_PACKAGE_VERSION}
          Section: admin
          Priority: optional
          Architecture: amd64
          Maintainer: ${CI_PACKAGE_MAINTAINER}
          Description: ${CI_PACKAGE_DESC}
          EOF
          dpkg-deb --build stage/linux "dist/${CI_PACKAGE_NAME}_${CI_PACKAGE_VERSION}_amd64.deb"
          rm -rf stage/linux/DEBIAN

          # --- .rpm ---
          install -d "stage/rpmbuild/SOURCES"
          tar -C stage/linux -czf "stage/rpmbuild/SOURCES/${CI_PACKAGE_NAME}-${CI_PACKAGE_VERSION}-linux-root.tar.gz" .
          install -d "stage/rpmbuild/SPECS"
          cat > "stage/rpmbuild/SPECS/${CI_PACKAGE_NAME}.spec" <<EOF
          Name: ${CI_PACKAGE_NAME}
          Version: ${CI_PACKAGE_VERSION}
          Release: 1%{?dist}
          Summary: ${CI_PACKAGE_COMMENT}
          License: GPL-3.0-only
          URL: ${CI_PACKAGE_WWW}
          BuildArch: x86_64
          Source0: ${CI_PACKAGE_NAME}-${CI_PACKAGE_VERSION}-linux-root.tar.gz

          %description
          ${CI_PACKAGE_DESC}

          %prep

          %build

          %install
          mkdir -p %{buildroot}
          tar -C %{buildroot} -xzf %{SOURCE0}

          %files
          /usr/sbin/${CI_PACKAGE_NAME}
          /usr/bin/cssh-keyscan
          /etc/systemd/system/${CI_PACKAGE_NAME}.service
          %dir /etc/centralssh
          %dir /etc/centralssh/users
          /etc/centralssh/config.toml
          /etc/centralssh/servers.toml
          /etc/centralssh/known_hosts
          %dir /var/log/centralssh
          /var/log/centralssh/audit.jsonl
          EOF
          rpmbuild --define "_topdir $PWD/stage/rpmbuild" -bb "stage/rpmbuild/SPECS/${CI_PACKAGE_NAME}.spec"
          cp "stage/rpmbuild/RPMS/x86_64/${CI_PACKAGE_NAME}-${CI_PACKAGE_VERSION}-1.x86_64.rpm" \
             "dist/${CI_PACKAGE_NAME}-${CI_PACKAGE_VERSION}-1.x86_64.rpm"

      - name: Validate Linux packages
        shell: sh
        env:
          CI_PACKAGE_NAME: ${{ env.CI_PACKAGE_NAME }}
          CI_PACKAGE_VERSION: ${{ env.CI_PACKAGE_VERSION }}
        run: |
          set -eu
          test -f "dist/${CI_PACKAGE_NAME}_${CI_PACKAGE_VERSION}_amd64.deb"
          test -f "dist/${CI_PACKAGE_NAME}-${CI_PACKAGE_VERSION}-1.x86_64.rpm"

      - name: Publish Linux packages
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: sh
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN || secrets.GITHUB_TOKEN || '' }}
          CI_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu

          api_url="${FORGEJO_API_URL:-${GITHUB_API_URL:-https://api.github.com}}"
          repository="${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY:-}}"
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:-}}"
          release_tag="${CI_RELEASE_TAG:-${GITHUB_REF_NAME:-${GITHUB_REF#refs/tags/}}}"

          if [ -z "$api_url" ] || [ -z "$repository" ] || [ -z "$token" ]; then
            echo "Missing release API context." >&2
            exit 1
          fi

          auth_header="Authorization: token ${token}"

          # Check if release already exists
          release_json="$(curl -fsS -H "$auth_header" \
            "${api_url%/}/repos/${repository}/releases/tags/${release_tag}" 2>/dev/null || true)"

          if [ -z "$release_json" ]; then
            # Create release
            create_payload="$(jq -n --arg tag "$release_tag" --arg name "$release_tag" \
              '{tag_name:$tag,name:$name,draft:false,prerelease:false}')"
            release_json="$(curl -fsS -X POST -H "$auth_header" -H 'Content-Type: application/json' \
              -d "$create_payload" "${api_url%/}/repos/${repository}/releases")"
          fi

          release_id="$(printf '%s' "$release_json" | jq -r '.id')"
          if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
            echo "Failed to resolve release id." >&2
            exit 1
          fi

          # Upload all dist assets
          for asset_path in dist/*; do
            [ -f "$asset_path" ] || continue
            asset_name="$(basename "$asset_path")"

            # Delete existing asset if present
            existing_id="$(printf '%s' "$release_json" | jq -r --arg n "$asset_name" \
              '.assets[]? | select(.name == $n) | .id' 2>/dev/null | head -n1)"
            if [ -n "$existing_id" ] && [ "$existing_id" != "null" ]; then
              curl -fsS -X DELETE -H "$auth_header" \
                "${api_url%/}/repos/${repository}/releases/${release_id}/assets/${existing_id}" >/dev/null
            fi

            # Upload
            curl -fsS -X POST \
              -H "$auth_header" \
              -H 'Content-Type: application/octet-stream' \
              --data-binary @"$asset_path" \
              "${api_url%/}/repos/${repository}/releases/${release_id}/assets?name=${asset_name}" \
              || echo "Failed to upload ${asset_name}" >&2
          done

  freebsd:
    runs-on: ubuntu-22.04
    steps:
      - name: Prepare action runtime
        shell: sh
        run: |
          set -eu
          if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          else
            SUDO=""
          fi

          ${SUDO} apt-get update
          ${SUDO} apt-get install -y --no-install-recommends ca-certificates curl gnupg

          node_major=0
          if command -v node >/dev/null 2>&1; then
            node_major="$(node -p 'process.versions.node.split(".")[0]' 2>/dev/null || echo 0)"
          fi

          if [ "${node_major}" -lt 20 ]; then
            curl -fsSL https://deb.nodesource.com/setup_20.x | ${SUDO} bash -
            ${SUDO} apt-get install -y --no-install-recommends nodejs
          fi

          node --version

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Build and validate FreeBSD package
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14'
          usesh: true
          run: |
            set -eu

            pkg install -y --no-repo-update curl git gmake jq pkg

            # Install Rust
            fetch -q -o /tmp/rustup.sh https://sh.rustup.rs
            sh /tmp/rustup.sh -y --default-toolchain stable
            . $HOME/.cargo/env

            # Derive metadata from Cargo.toml
            CI_PACKAGE_NAME="$(sed -n 's/^name = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
            CI_PACKAGE_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
            CI_PACKAGE_COMMENT="$(sed -n 's/^description = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
            CI_PACKAGE_DESC="${CI_PACKAGE_COMMENT}"
            CI_PACKAGE_ORIGIN="security/${CI_PACKAGE_NAME}"
            CI_PACKAGE_MAINTAINER="root@localhost"
            repo_path="${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY:-}}"
            server_url="${FORGEJO_SERVER_URL:-${GITHUB_SERVER_URL:-}}"
            CI_PACKAGE_WWW="${server_url%/}/${repo_path}"

            cargo build --release
            gmake install DESTDIR="$PWD/stage" PREFIX=/usr/local

            # Required dirs
            mkdir -p "$PWD/stage/etc/centralssh/users"
            mkdir -p "$PWD/stage/var/log/centralssh"

            # Config files
            cp examples/config.toml "$PWD/stage/etc/centralssh/config.toml"
            cp examples/servers.toml "$PWD/stage/etc/centralssh/servers.toml"
            touch "$PWD/stage/etc/centralssh/known_hosts"
            touch "$PWD/stage/var/log/centralssh/audit.jsonl"

            # Permissions
            chmod 0700 "$PWD/stage/etc/centralssh/users"
            chmod 0700 "$PWD/stage/var/log/centralssh"

            # pkg-plist
            find "stage" -type f | sed 's|^stage/||' | LC_ALL=C sort > stage/pkg-plist
            find "stage" -type d -empty | sed 's|^stage/||' | LC_ALL=C sort -r | sed 's|^|@dir |' >> stage/pkg-plist

            # +MANIFEST
            printf '%s\n' \
              "name: ${CI_PACKAGE_NAME}" \
              "version: \"${CI_PACKAGE_VERSION}\"" \
              "origin: ${CI_PACKAGE_ORIGIN}" \
              "comment: \"${CI_PACKAGE_COMMENT}\"" \
              "maintainer: ${CI_PACKAGE_MAINTAINER}" \
              "www: ${CI_PACKAGE_WWW}" \
              "prefix: /" \
              "arch: freebsd:14:x86:64" \
              "desc: |" \
              "  ${CI_PACKAGE_DESC}" \
              > stage/+MANIFEST

            # Build .pkg
            mkdir -p dist
            tar -C stage -cf - \
              +MANIFEST \
              $(cd stage && find . -mindepth 1 -print | LC_ALL=C sort) \
              | xz -T0 -9e > "dist/${CI_PACKAGE_NAME}-${CI_PACKAGE_VERSION}-freebsd-amd64.pkg"

            # Validate
            test -f "dist/${CI_PACKAGE_NAME}-${CI_PACKAGE_VERSION}-freebsd-amd64.pkg"
            tar -tf "dist/${CI_PACKAGE_NAME}-${CI_PACKAGE_VERSION}-freebsd-amd64.pkg" >/dev/null

            # Publish directly from FreeBSD VM (avoids artifact transfer issues)
            api_url="${FORGEJO_API_URL:-${GITHUB_API_URL:-https://api.github.com}}"
            repository="${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY:-}}"
            token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:-}}"
            release_tag="${GITHUB_REF_NAME:-${GITHUB_REF#refs/tags/}}"

            if [ -n "$api_url" ] && [ -n "$repository" ] && [ -n "$token" ] && [ -n "$release_tag" ]; then
              auth_header="Authorization: token ${token}"

              # Check if release already exists
              release_json="$(curl -fsS -H "$auth_header" \
                "${api_url%/}/repos/${repository}/releases/tags/${release_tag}" 2>/dev/null || true)"

              if [ -z "$release_json" ]; then
                create_payload="$(jq -n --arg tag "$release_tag" --arg name "$release_tag" \
                  '{tag_name:$tag,name:$name,draft:false,prerelease:false}')"
                release_json="$(curl -fsS -X POST -H "$auth_header" -H 'Content-Type: application/json' \
                  -d "$create_payload" "${api_url%/}/repos/${repository}/releases")"
              fi

              release_id="$(printf '%s' "$release_json" | jq -r '.id')"
              if [ -n "$release_id" ] && [ "$release_id" != "null" ]; then
                asset_path="dist/${CI_PACKAGE_NAME}-${CI_PACKAGE_VERSION}-freebsd-amd64.pkg"
                asset_name="$(basename "$asset_path")"

                # Delete existing asset if present
                existing_id="$(printf '%s' "$release_json" | jq -r --arg n "$asset_name" \
                  '.assets[]? | select(.name == $n) | .id' 2>/dev/null | head -n1)"
                if [ -n "$existing_id" ] && [ "$existing_id" != "null" ]; then
                  curl -fsS -X DELETE -H "$auth_header" \
                    "${api_url%/}/repos/${repository}/releases/${release_id}/assets/${existing_id}" >/dev/null
                fi

                # Upload
                curl -fsS -X POST \
                  -H "$auth_header" \
                  -H 'Content-Type: application/octet-stream' \
                  --data-binary @"$asset_path" \
                  "${api_url%/}/repos/${repository}/releases/${release_id}/assets?name=${asset_name}" \
                  || echo "Failed to upload ${asset_name}" >&2
              fi
            fi

      - name: Check publish status
        run: |
          set -eu
          # This step runs on the host after the VM step completes
          # If the VM step succeeded, the package was built and published
          echo "FreeBSD package build and publish completed successfully"

  merge:
    runs-on: ubuntu-22.04
    needs: [linux, freebsd]
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.linux.result }}" = "success" ] && [ "${{ needs.freebsd.result }}" = "success" ]; then
            echo "::notice::All builds succeeded"
          else
            echo "::error::Build failed: linux=${{ needs.linux.result }}, freebsd=${{ needs.freebsd.result }}"
            exit 1
          fi
