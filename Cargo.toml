[package]
name = "centralssh"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "OpenSSH-compatible hardened SSH gateway"

[dependencies]
argon2 = { version = "0.5.3", features = ["std"] }
base32 = "0.5.1"
bytes = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4.5.58", features = ["derive", "env"] }
constant_time_eq = "0.3.1"
humantime = "2.3.0"
ipnet = "2.11.0"
libc = "0.2"
qrcode = "0.14.1"
rand = "0.9.2"
russh = { version = "0.60.2", default-features = false, features = ["flate2", "ring"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.9.8"
toml_edit = "0.22"
ssh-key = { version = "0.6", features = ["ed25519", "rand_core"] }
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
totp-rs = { version = "5.7.0", features = ["otpauth"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["fmt", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }

[dev-dependencies]
tempfile = "3.25.0"
