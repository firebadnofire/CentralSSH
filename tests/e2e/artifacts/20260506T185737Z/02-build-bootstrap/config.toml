[settings]
user_key_root = "/tmp/centralssh-qa/keys"
per_user_per_server = true
known_hosts_path = "/tmp/centralssh-qa/known_hosts"
audit_log_path = "/tmp/centralssh-qa/audit.jsonl"
enforce_password_policy = true
min_password_policy = 12

[fail2ban]
enabled = true
max_failures = 3
find_time = "60s"
ban_time = "20s"
max_ban_time = "2m"
backoff_multiplier = 2.0
delay_before_ban = true
delay_time = "1s"
persist_state = true
state_path = "/tmp/centralssh-qa/fail2ban_state.json"
